id: componenti
version: 0.1.0
purpose: >-
  Catalogo dei COMPONENTI inseribili a richiesta in una nota-entità (bottone
  «＋ Componenti» → meta_actions.inserisci_componente). Ogni voce nomina una MACRO
  di _macros.j2: render.write_componenti la rende in markdown, per categoria,
  dentro z.automazioni/data/componenti.json. Così la nota nasce snella e i
  componenti "da tavolo" (Al tavolo, Clock, Carattere, Cronologia, Vista…) si
  aggiungono solo quando servono — single source restano le macro Jinja.
# Campi:
#   id       chiave stabile del componente
#   label    etichetta mostrata nel suggester (con emoji)
#   desc     descrizione breve mostrata nel picker ("label — desc"): il DM sa
#            cosa fa prima di aggiungerlo
#   macro    nome della macro in _macros.j2 da rendere
#   arg      come chiamarla: 'category' (passa l'id-categoria) | 'none'
#   heading  intestazione ## che avvolge il blocco inserito = MARKER anti-duplicato
#   quando   applicabilità, mappata su segnali di core.yaml:
#              sempre  -> ogni categoria (uniforme di worldbuilding)
#              fronte  -> categorie in fronte_categorie
#              tappe   -> categorie in tappe_categorie
#              assi    -> categorie con assi_tematici
#            (in alternativa, `categorie: [..]` = lista esplicita di id-categoria)
componenti:
  - id: tavolo
    label: "🎲 Al tavolo"
    desc: "la superficie giocabile — uso al tavolo, gancio, pressione, condivisione"
    macro: tavolo
    arg: category
    heading: "## 🎲 Al tavolo"
    quando: sempre
  - id: clock
    label: "⏳ Clock del fronte"
    desc: "orologio a segmenti + conseguenza quando è pieno (solo i fronti)"
    macro: clock
    arg: none
    heading: "## ⏳ Fronte & clock"
    quando: fronte
  - id: carattere
    label: "📊 Carattere"
    desc: "gli slider degli assi tematici + radar dell'indole"
    macro: carattere
    arg: category
    heading: "## 📊 Carattere"
    quando: assi
  - id: cronologia
    label: "🕰 Cronologia"
    desc: "le tappe dell'entità attraverso le epoche (fondazione, ascesa, caduta…)"
    macro: cronologia
    arg: none
    heading: "## 🕰 Cronologia"
    quando: tappe
  - id: mappa
    label: "🗺 Mappa"
    desc: "una mappa navigabile dal campo Mappa (import Azgaar/Watabou o disegno)"
    macro: mappa
    arg: none
    heading: "## 🗺 Mappa"
    # Geografiche che NON incorporano già una mappa (luogo/mondo la bakeano nei loro
    # template bespoke): regno/cultura/bioma/ecosistema.
    categorie: [regno, cultura, bioma, ecosistema]
  - id: vista
    label: "👁 Vista"
    desc: "il pannello scheda dell'entità — «pronto al tavolo?» + «citato da»"
    macro: vista
    arg: none
    heading: "## 👁 Vista"
    quando: sempre
