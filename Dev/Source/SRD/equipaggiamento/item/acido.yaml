id: dnd.oggetto.acido
nome: Acido
categoria: equipaggiamento-avventura
costo: 
  valore: 25
  unita: moneta-oro
peso: {valore: 0.5, unita: kg}
descrizione: |
  Quando effettui l'azione Attacco, puoi sostituire uno dei tuoi attacchi lanciando una fiala di acido.
  Scegli come bersaglio una creatura o un oggetto che puoi vedere entro 6 metri da te.
  Il bersaglio deve superare un tiro salvezza su Destrezza (CD 8 più il tuo modificatore di Destrezza e il tuo bonus di competenza) o subire 2d6 danni da Acido.
