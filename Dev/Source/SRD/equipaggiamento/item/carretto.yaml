id: dnd.veicolo.carretto
nome: Carretto
categoria: veicolo-da-tiro
costo: {valore: 15, valuta: moneta-oro}
peso: {valore: 100, unita: kg}
descrizione: |
  Un animale che traina una carrozza, un carretto, un carro da guerra, una slitta o un carro può spostare un carico fino a cinque volte la sua capacità di carico base, compreso il peso del veicolo. Se più animali trainano lo stesso veicolo, si sommano le loro capacità di carico.
