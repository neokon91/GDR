id: dnd.incantesimo.cura-ferite
nome: Cura ferite
livello: 1
scuola: abiurazione
classi:
  - dnd.classe.bardo
  - dnd.classe.chierico
  - dnd.classe.druido
  - dnd.classe.paladino
  - dnd.classe.ranger
tempo_lancio: azione
gittata: contatto
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Una creatura toccata dall'incantatore recupera un numero di punti ferita pari a 2d8 più il modificatore di caratteristica da incantatore dell'incantatore.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  La guarigione aumenta di 2d8 per ogni slot di livello superiore al 1º.
attivita:
  - tipo: cura
    cura: { numero_dadi: 2, dado: d8, bonus: { caratteristica: incantesimo } }
