id: dnd.incantesimo.legame-planare
nome: Legame planare
livello: 5
scuola: abiurazione
classi:
  - dnd.classe.bardo
  - dnd.classe.chierico
  - dnd.classe.druido
  - dnd.classe.mago
  - dnd.classe.warlock
tempo_lancio: 1 ora
gittata: 18
componenti: [V, S, "M (un gioiello del valore di 1.000 mo o più, che l'incantesimo consuma)"]
concentrazione: false
rituale: false
durata: 24 ore
descrizione: |
  L'incantatore tenta di vincolare un celestiale, un elementale, un folletto o un immondo al suo servizio. La creatura deve trovarsi entro gittata per l'intera durata del lancio dell'incantesimo (in genere, la creatura viene prima evocata al centro di una versione invertita dell'incantesimo cerchio magico per tenerla intrappolata mentre questo incantesimo viene lanciato). Completato il lancio dell'incantesimo, il bersaglio deve superare un tiro salvezza su Carisma, altrimenti è obbligato a servire l'incantatore per la durata dell'incantesimo. Se la creatura è stata evocata o creata da un altro incantesimo, la durata di quell'incantesimo viene estesa per corrispondere alla durata di questo.

  Una creatura vincolata deve eseguire gli ordini al meglio delle sue capacità. L'incantatore potrebbe ordinarle di accompagnarlo in un'avventura, di proteggere un luogo o di consegnare un messaggio. Se la creatura è ostile, cercherà in tutti i modi di distorcere gli ordini dell'incantatore per perseguire i suoi obiettivi personali. Se la creatura porta a termine gli ordini dell'incantatore prima del termine dell'incantesimo, si reca da lui per riferirglielo, ma solo se si trovano sullo stesso piano di esistenza. Se l'incantatore si trova su un piano diverso, la creatura ritorna nel luogo in cui è stata vincolata e vi rimane fino al termine dell'incantesimo.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  La durata aumenta con uno slot incantesimo di 6º livello (10 giorni), di 7º livello (30 giorni), di 8º livello (180 giorni) e di 9º livello (366 giorni).
