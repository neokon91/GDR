id: dnd.incantesimo.tempesta-di-fuoco
nome: Tempesta di fuoco
livello: 7
scuola: invocazione
classi:
  - dnd.classe.chierico
  - dnd.classe.druido
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 45
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Una tempesta di fuoco compare in un luogo entro gittata.
  L'area della tempesta è composta da dieci cubi con spigolo di 3 metri, che l'incantatore può disporre come desidera.
  Ogni cubo deve essere contiguo ad almeno un altro cubo.
  Ogni creatura nell'area effettua un tiro salvezza su Destrezza; se lo fallisce, subisce 7d10 danni da fuoco, mentre se lo supera subisce la metà dei danni.

  Gli oggetti infiammabili nell'area che non sono indossati o trasportati iniziano a bruciare.
attivita:
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: destrezza, cd: incantesimo }
    fallimento:
      danno: { numero_dadi: 7, dado: d10, tipo_danno: fuoco }
    successo: danno-dimezzato
