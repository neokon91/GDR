id: dnd.incantesimo.infliggi-ferite
nome: Infliggi ferite
livello: 1
scuola: necromanzia
classi:
  - dnd.classe.chierico
tempo_lancio: azione
gittata: contatto
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Una creatura toccata dall'incantatore effettua un tiro salvezza su Costituzione, subendo 2d10 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d10 per ogni slot di livello superiore al 1º.
attivita:
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: costituzione, cd: incantesimo }
    fallimento:
      danno: { numero_dadi: 2, dado: d10, tipo_danno: necrotico }
    successo: danno-dimezzato
