id: dnd.incantesimo.guardiani-spirituali
nome: Guardiani spirituali
livello: 3
scuola: evocazione
classi:
  - dnd.classe.chierico
tempo_lancio: azione
gittata: incantatore
componenti: [V, S, "M (una pergamena con una preghiera)"]
concentrazione: true
rituale: false
durata: fino a 10 minuti
descrizione: |
  Degli spiriti protettori fluttuano attorno al personaggio in un'emanazione di 4,5 metri per la durata dell'incantesimo. Se l'incantatore è buono o neutrale, la loro forma spettrale appare angelica o fatata (a scelta dell'incantatore). Se è malvagio, appaiono con sembianze demoniache.

  Quando l'incantatore lancia questo incantesimo, può indicare le creature che non ne saranno influenzate. All'interno dell'emanazione, la velocità di ogni altra creatura è dimezzata e, ogni volta che una creatura entra nel suo spazio e viceversa, o ogni volta che vi termina lì il turno, dovrà effettuare un tiro salvezza su Saggezza. Se lo fallisce, subisce 3d8 danni radiosi (se l'incantatore è buono o neutrale) o 3d8 danni necrotici (se è malvagio), mentre se lo supera subisce soltanto la metà di quei danni. Una creatura effettua questo tiro salvezza solo una volta per turno.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d8 per ogni slot di livello superiore al 3º.
attivita:
  - tipo: tiro-salvezza
    innesco: entra-nell-area
    scelta: { id: aura-guardiani, opzioni: [radioso, necrotico] }
    tiro_salvezza: { caratteristica: saggezza, cd: incantesimo }
    fallimento: { danno: { numero_dadi: 3, dado: d8, tipo_danno: { scelta: aura-guardiani } } }
    successo: danno-dimezzato
