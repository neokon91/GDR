id: dnd.incantesimo.stregoneria-esplosiva
nome: Stregoneria esplosiva
livello: 0
scuola: invocazione
classi:
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 36
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  L'incantatore proietta energia stregonesca verso una creatura o un oggetto entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d8 danni di un tipo a scelta tra: acido, freddo, fuoco, fulmine, psichici, tuono o veleno.

  Se l'incantatore ottiene il risultato 8 su un d8, può tirare un altro d8 e aggiungere il risultato ai danni. Quando lancia l'incantesimo, l'incantatore può aggiungere ai danni dell'incantesimo un numero di d8 pari al suo modificatore di caratteristica da incantatore.
scaling: |
  **Trucchetto potenziato**
  I danni di questo incantesimo aumentano di 1d8 quando l'incantatore raggiunge il 5º livello (2d8), l'11º livello (3d8) e il 17º livello (4d8).
