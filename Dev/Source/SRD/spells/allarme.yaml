id: dnd.incantesimo.allarme
nome: Allarme
livello: 1
scuola: abiurazione
classi: 
  - dnd.classe.mago
  - dnd.classe.ranger
tempo_lancio: "1 minuto"
gittata: 9
componenti: [V, S, "M (una campanella e un filo d'argento)"]
concentrazione: false
rituale: true
durata: "8 ore"
descrizione: |
  L'incantatore predispone un allarme che segnala un'intrusione.
  Sceglie una porta, una finestra o un'area entro gittata che non sia più ampia di un [cubo] con spigolo di 6 metri.
  Fino al termine dell'incantesimo, un allarme avverte l'incantatore tutte le volte che una creatura
  tocca o entra nell'area protetta. Al momento del lancio dell'incantesimo, l'incantatore designa
  quali creature non faranno scattare l'allarme. Inoltre, sceglie se l'allarme è acustico o mentale.

  **Allarme acustico.** L'allarme produce il suono di una campanella per 10 secondi entro 18 metri dall'area protetta. 
  
  **Allarme mentale.** Un suono nella mente avverte l'incantatore se questi si trova entro 1,5 chilometri dall'area protetta.
  Il suono sveglia l'incantatore se sta dormendo.
