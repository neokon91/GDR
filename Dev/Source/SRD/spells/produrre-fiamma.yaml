id: dnd.incantesimo.produrre-fiamma
nome: Produrre fiamma
livello: 0
scuola: evocazione
classi:
  - dnd.classe.druido
tempo_lancio: azione bonus
gittata: incantatore
componenti: [V, S]
concentrazione: false
rituale: false
durata: 10 minuti
descrizione: |
  Una fiamma tremolante compare nella mano dell'incantatore e permane per la durata dell'incantesimo. La fiamma non emette calore e non può incendiare nulla; emana luce intensa in un raggio di 6 metri e luce fioca per ulteriori 6 metri. L'incantesimo termina se l'incantatore lo lancia di nuovo.

  Fino al termine dell'incantesimo, l'incantatore può effettuare un'azione di Magia per scagliare la fiamma contro una creatura o un oggetto a 18 metri da lui, effettuando un attacco a distanza con incantesimo. Se il colpo va a segno, il bersaglio subisce 1d8 danni da fuoco.
scaling: |
  **Trucchetto potenziato**
  I danni di questo incantesimo aumentano di 1d8 quando l'incantatore raggiunge il 5º livello (2d8), l'11º livello (3d8) e il 17º livello (4d8).
attivita:
  - tipo: attacco
    attacco: { categoria: distanza, caratteristica: incantesimo }
    colpito:
      danno: { numero_dadi: 1, dado: d8, tipo_danno: fuoco }
    scaling: { quando: livello-pg, danno: { numero_dadi: 1, dado: d8, tipo_danno: fuoco } }
