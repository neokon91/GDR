id: dnd.incantesimo.anti-individuazione
nome: Anti-individuazione
livello: 3
scuola: abiurazione
classi: 
  - dnd.classe.bardo
  - dnd.classe.mago
  - dnd.classe.ranger
tempo_lancio: azione
gittata: contatto
componenti: [V, S, "M (un pizzico di polvere di diamante del valore di 25 mo o più, che l'incantesimo consuma)"]
concentrazione: false
rituale: false
durata: 8 ore
descrizione: |
  Per la durata dell'incantesimo, l'incantatore nasconde agli incantesimi di divinazione un bersaglio da lui toccato.
  Il bersaglio può essere una creatura consenziente, oppure un luogo o un oggetto non più grande di 3 metri
  in qualsiasi dimensione. Il bersaglio non può essere preso di mira da alcun incantesimo di divinazione né
  percepito da sensori di scrutamento magico.
