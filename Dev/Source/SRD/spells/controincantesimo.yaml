id: dnd.incantesimo.controincantesimo
nome: Controincantesimo
livello: 3
scuola: abiurazione
classi:
  - dnd.classe.mago
  - dnd.classe.stregone
  - dnd.classe.warlock
tempo_lancio: reazione
innesco: "l'incantatore può effettuare quando vede una creatura entro 18 metri da lui lanciare un incantesimo con componenti verbali, somatiche o materiali"
gittata: 18
componenti: [S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  L'incantatore tenta di interrompere una creatura nell'atto di lanciare un incantesimo. La creatura effettua un tiro salvezza su Costituzione. Se lo fallisce, l'incantesimo si dissolve senza alcun effetto e l'azione, azione bonus o reazione utilizzata per lanciarlo viene sprecata. Se l'incantesimo è stato lanciato usando uno slot incantesimo, lo slot non viene consumato.
