id: dnd.incantesimo.nube-mortale
nome: Nube mortale
livello: 5
scuola: evocazione
classi:
  - dnd.classe.mago
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 36
componenti: [V, S]
concentrazione: true
rituale: false
durata: fino a 10 minuti
descrizione: |
  L'incantatore genera una sfera di nebbia giallo-verdastra del raggio di 6 metri centrata su un punto entro gittata. La nebbia permane la durata dell'incantesimo o finché un vento forte (come quello creato da folata di vento) non la disperde, ponendo fine all'incantesimo. L'area della sfera è pesantemente oscurata.

  Ogni creatura nella sfera effettua un tiro salvezza su Costituzione, subendo 5d8 danni da veleno in caso di fallimento, o la metà dei danni in caso di successo. Una creatura deve effettuare questo tiro salvezza anche quando la sfera si muove nel suo spazio e quando la creatura entra nella sfera o vi termina il suo turno. Una creatura effettua questo tiro salvezza solo una volta per turno.

  La sfera si allontana di 3 metri dall'incantatore all'inizio di ogni suo turno.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d8 per ogni slot di livello superiore al 4º.
attivita:
  - tipo: tiro-salvezza
    innesco: fine-turno-nell-area
    tiro_salvezza: { caratteristica: costituzione, cd: incantesimo }
    fallimento: { danno: { numero_dadi: 5, dado: d8, tipo_danno: veleno } }
    successo: danno-dimezzato
