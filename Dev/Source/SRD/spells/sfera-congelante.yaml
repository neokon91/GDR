id: dnd.incantesimo.sfera-congelante
nome: Sfera congelante
livello: 6
scuola: invocazione
classi:
  - dnd.classe.mago
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 90
componenti: [V, S, "M (una sfera di cristallo in miniatura)"]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Una sfera congelata sfreccia dall'incantatore verso un punto a sua scelta entro gittata, dove esplode in una sfera di 18 metri di raggio. Ogni creatura in quell'area effettua un tiro salvezza su Costituzione, subendo 10d6 danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.

  Se la sfera colpisce uno specchio d'acqua, congela l'acqua fino a una profondità di 15 centimetri su un'area quadrata con lato di 9 metri. Lo strato di ghiaccio dura 1 minuto. Le creature che stavano nuotando sulla superficie dell'acqua ghiacciata rimangono intrappolate nel ghiaccio e sono trattenute. Per liberarsi, possono effettuare un'azione per effettuare una prova di Forza (Atletica) contro la CD del tiro salvezza sull'incantesimo.

  Una volta completato il lancio dell'incantesimo, l'incantatore può decidere di non scagliare la sfera. Così facendo, una sfera grande all'incirca quanto un proiettile da fionda, freddo al tatto, compare nella sua mano. In qualsiasi momento, l'incantatore o una creatura a cui l'ha consegnata può lanciare la sfera (entro una gittata di 12 metri) o scagliarla con una fionda (entro la normale gittata della fionda). La sfera si infrange all'impatto, con lo stesso effetto di un lancio normale dell'incantesimo. Tuttavia, l'incantatore può anche appoggiare la sfera a terra senza romperla. Dopo 1 minuto, se non è ancora stata infranta, la sfera esplode.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d6 per ogni slot di livello superiore al 6º.
attivita:
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: costituzione, cd: incantesimo }
    fallimento:
      danno: { numero_dadi: 10, dado: d6, tipo_danno: freddo }
    successo: danno-dimezzato
