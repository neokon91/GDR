id: dnd.incantesimo.inaridire
nome: Inaridire
livello: 4
scuola: necromanzia
classi:
  - dnd.classe.druido
  - dnd.classe.mago
  - dnd.classe.stregone
  - dnd.classe.warlock
tempo_lancio: azione
gittata: 9
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Una creatura entro gittata che l'incantatore è in grado di vedere effettua un tiro salvezza su Costituzione, subendo 8d8 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo. Una creatura vegetale fallisce automaticamente il tiro salvezza.

  In alternativa, l'incantatore bersaglia un vegetale non magico che non sia una creatura, come un albero o un arbusto. Il vegetale non effettua il tiro salvezza, semplicemente appassisce e muore.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d8 per ogni slot di livello superiore al 4º.
attivita:
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: costituzione, cd: incantesimo }
    fallimento:
      danno: { numero_dadi: 8, dado: d8, tipo_danno: necrotico }
    successo: danno-dimezzato
