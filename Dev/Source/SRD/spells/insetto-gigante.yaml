id: dnd.incantesimo.insetto-gigante
nome: Insetto gigante
livello: 4
scuola: evocazione
classi:
  - dnd.classe.druido
tempo_lancio: azione
gittata: 18
componenti: [V, S]
concentrazione: true
rituale: false
durata: fino a 10 minuti
creatura_evocata: dnd.mostro.insetto-gigante
descrizione: |
  L'incantatore evoca un millepiedi gigante, un ragno gigante o una vespa gigante (a sua scelta al momento del lancio). L'insetto si manifesta in uno spazio libero entro gittata che l'incantatore è in grado di vedere e utilizza la scheda delle statistiche dell'insetto gigante. La forma scelta dall'incantatore determina alcuni dettagli della sua scheda delle statistiche. La creatura scompare quando scende a 0 punti ferita o quando l'incantesimo termina.

  ed è un alleato per il personaggio e i suoi alleati. In combattimento, la creatura ha lo stesso punteggio di iniziativa dell'incantatore, ma inizia il turno immediatamente dopo il suo, obbedendo ai suoi comandi verbali (nessuna azione richiesta da parte dell'incantatore). Se l'incantatore non pronuncia comandi verbali, la creatura compie l'azione di Schivata e usa il suo movimento per sottrarsi al pericolo.

  **Utilizzo di uno slot incantesimo di livello superiore**
  Usa il livello dello slot incantesimo relativo al livello dell'incantesimo nella scheda delle statistiche.
