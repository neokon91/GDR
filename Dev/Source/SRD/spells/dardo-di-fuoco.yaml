id: dnd.incantesimo.dardo-di-fuoco
nome: Dardo di Fuoco
livello: 0
scuola: invocazione
classi: [dnd.classe.mago, dnd.classe.stregone]
tempo_lancio: azione
gittata: 36
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Scagli una scintilla di fuoco contro una creatura o un oggetto entro gittata.
  Effettua un attacco con incantesimo a distanza contro il bersaglio.
  Se colpisci, il bersaglio subisce 1d10 danni da fuoco.
  Un oggetto infiammabile colpito da questo incantesimo prende fuoco se non è indossato o trasportato.
scaling: |
  **Trucchetto potenziato**
  I danni aumentano di 1d10 quando l'incantatore raggiunge il 5º livello (2d10),
  l'11º livello (3d10) e il 17º livello (4d10).
attivita:
  - tipo: attacco
    attacco: { categoria: distanza, caratteristica: incantesimo }
    colpito:
      danno: { numero_dadi: 1, dado: d10, tipo_danno: fuoco }
    scaling: { quando: livello-pg, danno: { numero_dadi: 1, dado: d10, tipo_danno: fuoco } }
