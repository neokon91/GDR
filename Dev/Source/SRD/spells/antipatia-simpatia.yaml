id: dnd.incantesimo.antipatia-simpatia
nome: Antipatia/Simpatia
livello: 8
scuola: ammaliamento
classi: 
  - dnd.classe.bardo
  - dnd.classe.druido
  - dnd.classe.mago
tempo_lancio: 1 ora
gittata: 18
componenti: [V, S, "M (una miscela di aceto e miele)"]
concentrazione: false
rituale: false
durata: 10 giorni
descrizione: |
  Quando l'incantatore lancia l'incantesimo, decide se creare antipatia o simpatia e sceglie come
  bersaglio una creatura o un oggetto di taglia Enorme o inferiore. Dopodiché, specifica un tipo di creatura,
  come per esempio draghi rossi, goblin o vampiri. Una creatura del tipo scelto effettua un tiro salvezza
  su Saggezza quando si trova entro 36 metri dal bersaglio. La scelta dell'incantatore tra gli effetti di
  antipatia e simpatia determina cosa accade a una creatura quando questa fallisce il tiro salvezza.

  **Antipatia.** La creatura è spaventata e deve usare il movimento nel suo turno per allontanarsi
  il più possibile dal bersaglio, muovendosi per la via più sicura. Simpatia. La creatura è affascinata
  e deve usare il movimento nel suo turno per avvicinarsi il più possibile al bersaglio, muovendosi per
  la via più sicura. Se la creatura si trova entro 1,5 metri dal bersaglio, non può allontanarsi volontariamente.
  Se il bersaglio infligge danni alla creatura affascinata, questa può effettuare un tiro salvezza su Saggezza
  per porre fine all'effetto, come descritto di seguito.

  **Porre fine all'effetto.** Se la creatura spaventata o affascinata termina il suo turno a più di 36 metri
  di distanza dal bersaglio, effettua un tiro salvezza su Saggezza. In caso di successo, la creatura non è più
  sotto l'influenza del bersaglio. Una creatura che supera un tiro salvezza contro l'effetto ne è immune per
  1 minuto, al termine del quale può esserne influenzata di nuovo.
