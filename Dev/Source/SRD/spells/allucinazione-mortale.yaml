id: dnd.incantesimo.allucinazione-mortale
nome: Allucinazione mortale
livello: 4
scuola: illusione
classi: 
  - dnd.classe.bardo
  - dnd.classe.mago
tempo_lancio: azione
gittata: 36
componenti: [V, S]
concentrazione: true
rituale: false
durata: fino a 1 minuto
attivita:
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: saggezza, cd: incantesimo }
    fallimento:
      - danno: { numero_dadi: 4, dado: d10, tipo_danno: psichico }
    successo: danno-dimezzato
descrizione: |
  L'incantatore attinge agli incubi di una creatura entro gittata che egli è in grado di vedere
  e crea un'illusione delle sue paure più profonde, visibile solo a lei. Il bersaglio effettua
  un tiro salvezza su Saggezza. In caso di fallimento, subisce 4d10 danni psichici
  e subisce Svantaggio alle prove di caratteristica e ai tiri per colpire per la durata dell'incantesimo.
  In caso di successo, subisce soltanto la metà di quei danni e l'incantesimo termina.

  Per la durata dell'incantesimo, il bersaglio effettua un tiro salvezza su Saggezza alla fine di ogni suo turno.
  In caso di fallimento, subisce nuovamente i danni psichici. In caso di successo, l'incantesimo termina.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d10 per ogni slot di livello superiore al 4º.
