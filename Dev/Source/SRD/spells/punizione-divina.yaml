id: dnd.incantesimo.punizione-divina
nome: Punizione divina
livello: 1
scuola: invocazione
classi:
  - dnd.classe.paladino
tempo_lancio: azione bonus
innesco: "l'incantatore effettua subito dopo aver colpito un bersaglio con un'arma da mischia o con un colpo senz'armi"
gittata: incantatore
componenti: [V]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Il bersaglio subisce 2d8 danni radiosi extra dall'attacco. I danni aumentano di 1d8 se il bersaglio è un immondo o un non morto.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d8 per ogni slot di livello superiore al 1º.
