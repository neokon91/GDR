id: dnd.incantesimo.intimorire-infernale
nome: Intimorire infernale
livello: 1
scuola: invocazione
classi:
  - dnd.classe.warlock
tempo_lancio: reazione
innesco: "l'incantatore effettua quando subisce danni da una creatura che egli è in grado di vedere entro 18 metri da sé"
gittata: 18
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  La creatura che ha inflitto danni all'incantatore viene temporaneamente avviluppata da fiamme verdi. La creatura effettua un tiro salvezza su Destrezza, subendo 2d10 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d10 per ogni slot di livello superiore al 1º.
attivita:
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: destrezza, cd: incantesimo }
    fallimento:
      danno: { numero_dadi: 2, dado: d10, tipo_danno: fuoco }
    successo: danno-dimezzato
