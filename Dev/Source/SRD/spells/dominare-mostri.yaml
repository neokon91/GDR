id: dnd.incantesimo.dominare-mostri
nome: Dominare mostri
livello: 8
scuola: ammaliamento
classi:
  - dnd.classe.bardo
  - dnd.classe.mago
  - dnd.classe.stregone
  - dnd.classe.warlock
tempo_lancio: azione
gittata: 18
componenti: [V, S]
concentrazione: true
rituale: false
durata: fino a 1 ora
descrizione: |
  Una creatura entro gittata e che l'incantatore è in grado di vedere deve superare un tiro salvezza su Saggezza, altrimenti diventa affascinato per la durata dell'incantesimo. Il bersaglio dispone di vantaggio al tiro salvezza se l'incantatore o i suoi alleati stanno combattendo contro di essa. Ogni volta che il bersaglio subisce danni, ripete il tiro salvezza; se lo supera, l'effetto svanisce.

  L'incantatore ha un legame telepatico con il bersaglio affascinato mentre i due si trovano sullo stesso piano di esistenza. Nel proprio turno, l'incantatore può utilizzare questo legame per impartire comandi al bersaglio (nessuna azione richiesta), come ad esempio "attacca quella creatura", "spostati lì", o "recupera quell'oggetto". Il bersaglio fa del suo meglio per obbedire nel suo turno. Se porta a termine un ordine e non riceve ulteriori istruzioni dall'incantatore, agisce e si muove a suo piacimento, concentrandosi sulla propria incolumità.

  L'incantatore può comandare al bersaglio di effettuare una reazione, ma per farlo dovrà utilizzare la propria reazione.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  La concentrazione dell'incantatore può durare più a lungo usando uno slot incantesimo di 9º livello (fino a 8 ore).
attivita:
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: saggezza, cd: incantesimo }
    fallimento:
      - concede: affascinato
        durata: { valore: 1, unita: ore }
