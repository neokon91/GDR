id: dnd.incantesimo.raggio-di-infermita
nome: Raggio di infermità
livello: 1
scuola: necromanzia
classi:
  - dnd.classe.mago
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 18
componenti: [V, S]
concentrazione: false
rituale: false
durata: istantanea
attivita:
  - tipo: attacco
    attacco: { categoria: distanza, caratteristica: incantesimo }
    colpito:
      - danno: { numero_dadi: 2, dado: d8, tipo_danno: veleno }
      - concede: avvelenato
        durata: { valore: 1, unita: round }
descrizione: |
  L'incantatore proietta un raggio di energia verdastra verso una creatura entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 2d8 danni da veleno ed è avvelenato fino al termine del turno successivo dell'incantatore.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d8 per ogni slot di livello superiore al 1º.
