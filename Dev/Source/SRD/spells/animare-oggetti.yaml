id: dnd.incantesimo.animare-oggetti
nome: Animare oggetti
livello: 5
scuola: trasmutazione
classi: 
  - dnd.classe.bardo
  - dnd.classe.mago
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 36
componenti: [V, S]
concentrazione: true
rituale: false
durata: fino a 1 minuto
creatura_evocata: dnd.mostro.oggetto-animato
descrizione: |
  Gli oggetti si animano su ordine dell'incantatore. L'incantatore sceglie un numero di oggetti non magici
  entro gittata che non siano indossati o trasportati, fissati su una superficie o di dimensioni Mastodontiche.
  Il numero massimo di oggetti è uguale al suo modificatore di caratteristica da incantatore; per questo numero,
  un bersaglio di taglia Media o inferiore conta come un oggetto, un bersaglio di taglia Grande conta come due
  e un bersaglio Enorme conta come tre.

  Ogni bersaglio si anima e diventa un costrutto provvisto di gambe che utilizza la scheda delle statistiche
  dell'oggetto animato; questa creatura è sotto il controllo dell'incantatore fino al termine dell'incantesimo
  o finché non viene ridotta a 0 punti ferita. Ogni creatura creata con questo incantesimo diventa un alleato
  per l'incantatore e i suoi alleati. In combattimento, la creatura ha lo stesso punteggio di iniziativa dell'incantatore,
  ma inizia il turno immediatamente dopo il suo.

  Fino al termine dell'incantesimo, come azione bonus, l'incantatore può comandare mentalmente qualsiasi creatura
  creata con questo incantesimo, a patto che si trovi entro 150 metri da sé (se controlla varie creature,
  l'incantatore può comandarne più di una allo stesso momento, impartendo lo stesso comando a ciascuna di loro).
  Se invece non impartisce alcun comando, la creatura effettua l'azione Schivata e si sposta solo per evitare di
  subire danni. Quando la creatura scende a 0 punti ferita, riassume la sua forma di oggetto, a cui vengono
  trasferiti eventuali danni rimanenti.
scaling: |
  **Utilizzo di uno Slot Incantesimo di Livello Superiore.** I danni da Schianto della creatura aumentano di 1d4
  (taglia Media o inferiore), 1d6 (taglia Grande) o 1d12 (taglia Enorme) per ogni slot di livello superiore al 5º.
