id: dnd.incantesimo.parola-guaritrice
nome: Parola guaritrice
livello: 1
scuola: abiurazione
classi:
  - dnd.classe.bardo
  - dnd.classe.chierico
  - dnd.classe.druido
tempo_lancio: azione bonus
gittata: 18
componenti: [V]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  Una creatura scelta dall'incantatore entro gittata e che egli è in grado di vedere recupera un ammontare di punti ferita pari a 2d4 più il modificatore di caratteristica da incantatore dell'incantatore.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  La guarigione aumenta di 2d4 per ogni slot di livello superiore al 1º.
attivita:
  - tipo: cura
    cura: { numero_dadi: 2, dado: d4, bonus: { caratteristica: incantesimo } }
