id: dnd.incantesimo.alterare-se-stesso
nome: Alterare se stesso
livello: 2
scuola: trasmutazione
classi: 
  - dnd.classe.mago
  - dnd.classe.stregone
tempo_lancio: azione
gittata: incantatore
componenti: [V, S]
concentrazione: true
rituale: false
durata: fino a 1 ora
descrizione: |
  L'incantatore altera la propria forma fisica scegliendo tra le opzioni seguenti.
  Gli effetti permangono per la sua durata, durante la quale l'incantatore può effettuare
  un'azione di Magia per sostituire l'opzione scelta con una diversa.

  **Adattamento acquatico**. L'incantatore sviluppa le branchie e una membrana tra le dita. Inoltre,
  può respirare sott'acqua e ottenere una velocità di nuoto pari alla sua velocità.
  
  **Armi naturali**. L'incantatore sviluppa artigli (taglienti), zanne (perforanti),
  corna (perforanti) o zoccoli (contundenti). Quando usa il suo colpo senz'armi per infliggere danni
  con l'arma naturale creata, infligge 1d6 danni (del tipo indicato tra parentesi) invece di infliggere
  i danni normali del colpo senz'armi, usando il modificatore di caratteristica da incantatore
  per i tiri per colpire e per i tiri per i danni anziché quello di Forza.

  **Cambiare aspetto**. L'incantatore altera il suo aspetto: decide come apparire e definisce altezza, peso,
  lineamenti facciali, tono della voce, lunghezza dei capelli, carnagione e altri tratti distintivi.
  Può scegliere di assomigliare a un membro di un'altra specie, ma le sue statistiche non subiscono modifiche.
  Non può apparire come una creatura di taglia diversa e la sua forma base rimane la stessa; per esempio,
  se è bipede, non può usare l'incantesimo per diventare quadrupede. Per la durata dell'incantesimo,
  può effettuare un'azione di Magia per cambiare di nuovo il suo aspetto.
