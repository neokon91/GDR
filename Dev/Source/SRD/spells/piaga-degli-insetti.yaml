id: dnd.incantesimo.piaga-degli-insetti
nome: Piaga degli insetti
livello: 5
scuola: evocazione
classi:
  - dnd.classe.chierico
  - dnd.classe.druido
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 90
componenti: [V, S, "M (una locusta)"]
concentrazione: true
rituale: false
durata: fino a 10 minuti
descrizione: |
  Uno sciame di locuste riempie una sfera del raggio di 6 metri centrata su un punto a scelta dell'incantatore situato entro gittata. La sfera permane per la durata dell'incantesimo, la sua area è leggermente oscurata e lo spazio al suo interno è considerato terreno difficile.

  Quando lo sciame compare, ogni creatura al suo interno effettua un tiro salvezza su Costituzione, subendo 4d10 danni perforanti in caso di fallimento, o la metà dei danni in caso di successo. Inoltre, una creatura effettua questo tiro salvezza anche quando entra nell'area dell'incantesimo per la prima volta in un turno o quando vi termina il suo turno. Una creatura effettua questo tiro salvezza solo una volta per turno.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d10 per ogni slot di livello superiore al 5º.
attivita:
  # colpo iniziale (quando compare)
  - tipo: tiro-salvezza
    tiro_salvezza: { caratteristica: costituzione, cd: incantesimo }
    fallimento: { danno: { numero_dadi: 4, dado: d10, tipo_danno: perforante } }
    successo: danno-dimezzato
  # ricorrente (entra / termina il turno nell area)
  - tipo: tiro-salvezza
    innesco: entra-nell-area
    tiro_salvezza: { caratteristica: costituzione, cd: incantesimo }
    fallimento: { danno: { numero_dadi: 4, dado: d10, tipo_danno: perforante } }
    successo: danno-dimezzato
