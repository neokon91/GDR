id: dnd.incantesimo.globo-cromatico
nome: Globo cromatico
livello: 1
scuola: invocazione
classi:
  - dnd.classe.mago
  - dnd.classe.stregone
tempo_lancio: azione
gittata: 27
componenti: [V, S, "M (un diamante del valore di 50 mo o più)"]
concentrazione: false
rituale: false
durata: istantanea
descrizione: |
  L'incantatore scaglia un globo di energia contro un bersaglio entro gittata. Può scegliere che tipo di globo creare tra acido, freddo, fulmine, fuoco, tuono o veleno, e poi effettuare un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 3d8 danni del tipo scelto.

  Se l'incantatore ottiene lo stesso risultato su due o più d8, il globo schizza verso un altro bersaglio a scelta dell'incantatore che si trovi entro 9 metri dal primo bersaglio. L'incantatore effettua un tiro per colpire contro il secondo bersaglio e anche un altro tiro per i danni. Il globo non può più schizzare verso un altro bersaglio, a meno che l'incantatore non lanci l'incantesimo usando uno slot incantesimo di 2º livello o superiore.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni aumentano di 1d8 per ogni slot di livello superiore al 1º. Il globo può schizzare verso un altro bersaglio un numero massimo di volte pari al livello dello slot incantesimo consumato, ed è possibile bersagliare una creatura soltanto una volta per ogni lancio di questo incantesimo.
attivita:
  - tipo: attacco
    scelta: { id: tipo-globo, opzioni: [acido, freddo, fulmine, fuoco, tuono, veleno] }
    attacco: { categoria: distanza, caratteristica: incantesimo }
    colpito:
      danno: { numero_dadi: 3, dado: d8, tipo_danno: { scelta: tipo-globo } }
