id: dnd.incantesimo.immagine-maggiore
nome: Immagine maggiore
livello: 3
scuola: illusione
classi:
  - dnd.classe.bardo
  - dnd.classe.mago
  - dnd.classe.stregone
  - dnd.classe.warlock
tempo_lancio: azione
gittata: 36
componenti: [V, S, "M (un ciuffo di lana)"]
concentrazione: true
rituale: false
durata: fino a 10 minuti
descrizione: |
  L'incantatore crea l'immagine di un oggetto, una creatura o qualche altro fenomeno visibile che non sia più grande di un cubo con spigolo di 6 metri. L'immagine, apparendo in un punto situato entro gittata che l'incantatore è in grado di vedere, permane per la durata dell'incantesimo. L'immagine sembra reale e include temperature, suoni e odori appropriati all'elemento raffigurato, ma non può infliggere danni o causare condizioni.

  Se l'incantatore si trova entro la gittata dell'immagine illusoria, può effettuare la sua azione di Magia per fare in modo che l'immagine si muova fino a un qualsiasi altro punto entro gittata. Mentre l'immagine è in movimento, l'incantatore può alterarne l'aspetto in modo che i movimenti risultino naturali. Ad esempio, se l'incantatore crea l'immagine di una creatura e decide di farla muovere, può alterare l'immagine in modo da simulare che stia camminando. Analogamente, può fare in modo che l'illusione generi suoni diversi in momenti diversi, in modo da, per esempio, farle persino sostenere una conversazione.

  L'illusione può essere rivelata da un'interazione fisica, poiché è possibile passarle attraverso. Una creatura che effettua l'azione di Studio per esaminare l'immagine può determinare che si tratta di un'illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo. Se una creatura riconosce l'illusione per ciò che è, riesce a vedere attraverso l'immagine, di cui si attenuano le altre caratteristiche sensoriali.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  L'incantesimo dura finché non viene dissolto, e non necessita di concentrazione, se viene lanciato con uno slot incantesimo 4º livello o superiore.
