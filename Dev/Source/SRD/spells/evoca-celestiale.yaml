id: dnd.incantesimo.evoca-celestiale
nome: Evoca celestiale
livello: 7
scuola: evocazione
classi:
  - dnd.classe.chierico
tempo_lancio: azione
gittata: 27
componenti: [V, S]
concentrazione: true
rituale: false
durata: fino a 10 minuti
descrizione: |
  L'incantatore evoca uno spirito dai Piani Superiori, che si manifesta come un pilastro di luce in un cilindro del raggio di 3 metri e dell'altezza di 12 metri centrato in un punto entro gittata. Per ogni creatura che l'incantatore è in grado di vedere nel cilindro, sceglie quale di queste luci brilla su di essa:

  Luce curatrice. Il bersaglio recupera una quantità di punti ferita pari a 4d12 più il modificatore di caratteristica da incantatore dell'incantatore. Luce ustionante. Il bersaglio effettua un tiro sal- vezza su Destrezza, subendo 6d12 danni radiosi in caso di fallimento, o la metà dei danni in caso di successo.

  Fino al termine dell'incantesimo, una luce intensa riempie il cilindro e, quando l'incantatore si muove nel suo turno, può spostare anche il cilindro fino a 9 metri.

  Ogni volta che il cilindro si muove nello spazio di una creatura che l'incantatore è in grado di vedere e ogni volta che una creatura che l'incantatore è in grado di vedere entra nel cilindro o vi termina il suo turno, l'incantatore può immergerla in una di queste luci. Una creatura può essere influenzata da questo incantesimo solo una volta per turno.
scaling: |
  **Utilizzo di uno slot incantesimo di livello superiore**
  I danni e la guarigione aumentano di 1d12 per ogni slot di livello superiore al 7º.
attivita:
  - tipo: tiro-salvezza
    innesco: entra-nell-area
    tiro_salvezza: { caratteristica: destrezza, cd: incantesimo }
    fallimento: { danno: { numero_dadi: 6, dado: d12, tipo_danno: radioso } }
    successo: danno-dimezzato
