id: dnd.mostro.naga-spirituale
nome: Naga spirituale
taglia: grande
tipo: immondo
gruppo: Naga
allineamento: caotico malvagio
ca: {valore: 17}
caratteristiche:
  forza: {valore: 18, competenza: false}
  destrezza: {valore: 17, competenza: true}
  costituzione: {valore: 14, competenza: true}
  intelligenza: {valore: 16, competenza: false}
  saggezza: {valore: 15, competenza: true}
  carisma: {valore: 16, competenza: true}
dadi_vita: 18
velocita: {camminata: 12}
sensi: {scurovisione: 18}
percezione_passiva: 12
immunita_danni: [veleno]
immunita_condizioni: [affascinato, avvelenato]
lingue: [Abissale, Comune]
gs: 8

tratti:
  - nome: Ristoro immondo
    descrizione: |
      Se la naga muore, torna in vita dopo 1d6 giorni e recupera tutti i suoi punti ferita. Solo un incantesimo desiderio può impedire a questo tratto di funzionare.
azioni:
  - nome: Multiattacco
    descrizione: |
      La naga effettua tre attacchi, usando Morso o Raggio necrotico in qualsiasi combinazione.
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +7, portata 3 m. *Colpito:* 7 (1d6 + 4) danni perforanti più 14 (4d6) danni da veleno.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 1
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: forza}
  - nome: Raggio necrotico
    descrizione: |
      *Tiro per colpire a distanza:* +6, gittata 18 m. *Colpito:* 21 (6d6) danni necrotici.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
        colpito:
          - danno: {numero_dadi: 6, dado: d6, tipo_danno: necrotico}
  - nome: Incantesimi
    descrizione: |
      La naga lancia uno dei seguenti incantesimi, senza bisogno di componenti somatiche o materiali, utilizzando Intelligenza come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 14): 2/giorno ciascuno: blocca persone (di 3º livello), individuazione dei pensieri, fulmine (di 4º livello), porta dimensionaleA volontà: illusione minore, individuazione del magico, mano magica, respirare sott'acqua
    attivita:
      - tipo: incantatore
        caratteristica: intelligenza
        cd: 14
        a_volonta:
          - dnd.incantesimo.illusione-minore
          - dnd.incantesimo.individuazione-del-magico
          - dnd.incantesimo.mano-magica
          - dnd.incantesimo.respirare-sott-acqua
        al_giorno:
          - usi: 2
            incantesimi:
              - id: dnd.incantesimo.blocca-persone
                livello: 3
              - dnd.incantesimo.individuazione-dei-pensieri
              - id: dnd.incantesimo.fulmine
                livello: 4
              - dnd.incantesimo.porta-dimensionale
