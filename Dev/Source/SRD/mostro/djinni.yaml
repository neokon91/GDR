id: dnd.mostro.djinni
nome: Djinni
taglia: grande
tipo: elementale
allineamento: neutrale
ca: {valore: 17}
caratteristiche:
  forza: {valore: 21, competenza: false}
  destrezza: {valore: 15, competenza: true}
  costituzione: {valore: 22, competenza: false}
  intelligenza: {valore: 15, competenza: false}
  saggezza: {valore: 16, competenza: true}
  carisma: {valore: 20, competenza: false}
dadi_vita: 19
velocita: {camminata: 9, volo: 27}
sensi: {scurovisione: 36}
percezione_passiva: 13
immunita_danni: [fulmine, tuono]
lingue: ["Primordiale (Auran)"]
gs: 11

tratti:
  - nome: Desideri
    descrizione: |
      Il djinni ha una probabilità del 30% di conoscere l'incantesimo desiderio. Se il djinni lo conosce, può lanciarlo solo per conto di una creatura diversa da un genio che comunica un desiderio in un modo che il djinni è in grado di comprendere. Se il djinni lancia l'incantesimo per conto della creatura, non subisce alcuna conseguenza derivante dal lancio dell'incantesimo. Una volta che il djinni l'ha lanciato tre volte, non può farlo di nuovo per 365 giorni.
  - nome: Resistenza alla magia
    descrizione: |
      Il djinni dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
  - nome: Ristoro elementale
    descrizione: |
      Se il djinni muore al di fuori del Piano Elementale dell'Aria, il suo corpo si dissolve nell'aria ed esso ne acquisisce uno nuovo dopo 1d4 giorni, tornando in vita con tutti i suoi punti ferita da qualche parte sul Piano Elementale dell'Aria.
azioni:
  - nome: Multiattacco
    descrizione: |
      Il djinni effettua tre attacchi, usando Lama burrascosa o Lampo burrascoso in qualsiasi combinazione.
  - nome: Lama burrascosa
    descrizione: |
      *Tiro per colpire in mischia:* +9, portata 1,5 m. *Colpito:* 12 (2d6 + 5) danni taglienti più 7 (2d6) danni da fulmine.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Lampo burrascoso
    descrizione: |
      *Tiro per colpire a distanza:* +9, gittata 36 m. *Colpito:* 13 (3d8) danni da tuono. Se il bersaglio è una creatura di taglia Grande o inferiore, cade a terra prono.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
        colpito:
          - danno: {numero_dadi: 3, dado: d8, tipo_danno: tuono}
  - nome: Creare vortice
    descrizione: |
      Il djinni evoca un vortice in un punto che è in grado di vedere entro 36 metri. Il vortice riempie un cilindro del raggio di 6 metri e alto 18 metri, centrato su quel punto, e perdura fino al termine della concentrazione del djinni su di esso. Il djinni può spostare il vortice fino a 6 metri all'inizio di ogni suo turno. Ogni volta che il vortice entra nello spazio di una creatura o una creatura entra nello spazio del vortice, la creatura è soggetta al seguente effetto.

      *Tiro salvezza su Forza:* CD 17 (una creatura effettua questo tiro salvezza solo una volta per turno, e il djinni non subisce alcun effetto).

      *Fallimento:* finché si trova nel vortice, il bersaglio è trattenuto e si sposta insieme al vortice. All'inizio di ogni suo turno, il bersaglio trattenuto subisce 21 (6d6) danni da tuono. Alla fine di ogni suo turno, il bersaglio ripete il tiro salvezza e, se lo supera, l'effetto svanisce.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: forza
          cd: {caratteristica: forza, base: 8, competenza: true}
  - nome: Incantesimi
    descrizione: |
      Il djinni lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 17):

      *1/giorno ciascuno:*
      - creazione
      - forma gassosa
      - immagine maggiore
      - invisibilità
      - spostamento planare

      *2/giorno ciascuno:*
      - camminare nel vento
      - creare cibo e acqua (è in grado di creare vino invece di acqua)
      - linguaggi

      *A volontà:*
      - individuazione del bene e del male
      - individuazione del magico
    attivita:
      - tipo: incantatore
        caratteristica: carisma
        cd: 17
        a_volonta:
          - dnd.incantesimo.individuazione-del-bene-e-del-male
          - dnd.incantesimo.individuazione-del-magico
        al_giorno:
          - usi: 1
            incantesimi:
              - dnd.incantesimo.creazione
              - dnd.incantesimo.forma-gassosa
              - dnd.incantesimo.immagine-maggiore
              - dnd.incantesimo.invisibilita
              - dnd.incantesimo.spostamento-planare
          - usi: 2
            incantesimi:
              - dnd.incantesimo.camminare-nel-vento
              - dnd.incantesimo.creare-cibo-e-acqua
              - dnd.incantesimo.linguaggi
