id: dnd.mostro.drago-d-oro-giovane
nome: Drago d'oro giovane
taglia: grande
tipo: drago
sottotipo: metallico
gruppo: Draghi d'oro
allineamento: legale buono
ca: {valore: 18}
caratteristiche:
  forza: {valore: 23, competenza: false}
  destrezza: {valore: 14, competenza: true}
  costituzione: {valore: 21, competenza: false}
  intelligenza: {valore: 16, competenza: false}
  saggezza: {valore: 13, competenza: true}
  carisma: {valore: 20, competenza: false}
iniziativa: competenza
dadi_vita: 17
velocita: {camminata: 12, nuoto: 12, volo: 24}
abilita: [furtivita: competenza, intuizione: competenza, persuasione: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 9}
percezione_passiva: 19
immunita_danni: [fuoco]
lingue: [Comune, Draconico]
gs: 10

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di Soffio indebolente.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +10, portata 3 m. *Colpito:* 17 (2d10 + 6) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d10
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di fuoco (ricarica 5-6)"
    id: soffio-di-fuoco-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 17, tutte le creature in un cono di 9 metri. *Fallimento:* 55 (10d10) danni da fuoco. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 10, dado: d10, tipo_danno: fuoco}
        successo: danno-dimezzato
  - nome: Soffio indebolente
    id: soffio-indebolente
    descrizione: |
      *Tiro salvezza su Forza:* CD 17, ogni creatura che al momento non è sotto l'effetto di questo soffio in un cono di 9 metri. *Fallimento:* il bersaglio subisce svantaggio alle prove con d20 basate sulla Forza e sottrae 3 (1d6) ai tiri per i danni. La creatura ripete il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Dopo 1 minuto, il tiro viene superato automaticamente.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: forza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
