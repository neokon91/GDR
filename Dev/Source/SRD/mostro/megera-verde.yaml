id: dnd.mostro.megera-verde
nome: Megera verde
taglia: media
tipo: folletto
allineamento: neutrale malvagio
ca: {valore: 17}
caratteristiche:
  forza: {valore: 18, competenza: false}
  destrezza: {valore: 12, competenza: false}
  costituzione: {valore: 16, competenza: false}
  intelligenza: {valore: 13, competenza: false}
  saggezza: {valore: 14, competenza: false}
  carisma: {valore: 14, competenza: false}
dadi_vita: 11
velocita: {camminata: 9, nuoto: 9}
abilita: [furtivita: competenza, inganno: competenza, percezione: competenza, arcano: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 14
lingue: [Comune, Elfico, Silvano]
gs: 3

tratti:
  - nome: Anfibio
    descrizione: |
      La megera può respirare in aria e in acqua.
  - nome: Imitare
    descrizione: |
      La megera può imitare i versi degli animali e le voci degli umanoidi. Una creatura che sente tali suoni riesce a capire che si tratta di imitazioni solo superando una prova di Saggezza (Intuizione) con CD 14.
  - nome: Magia della congrega
    descrizione: |
      Finché si trova entro 9 metri da almeno due megere alleate, la megera può lanciare uno dei seguenti incantesimi senza bisogno di componenti materiali, utilizzando il normale tempo di lancio dell'incantesimo e Intelligenza come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 11): identificare, localizza oggetto, presagio, scrutare, servitore inosservato o trova famiglio. La megera deve terminare un riposo lungo prima di utilizzare questo tratto per lanciare di nuovo l'incantesimo.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: artiglio, ripetizioni: 2}
    descrizione: |
      La megera effettua due attacchi Artiglio.
  - nome: Artiglio
    id: artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +6, portata 1,5 m. *Colpito:* 8 (1d8 + 4) danni taglienti più 3 (1d6) danni da veleno.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Incantesimi
    id: incantesimi
    descrizione: |
      La megera lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Saggezza come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 12, +4 al tiro per colpire degli attacchi con incantesimo): A volontà: Camuffare se stesso (durata di 24 ore), illusione minore, invisibilità (solo se stessa, la megera non lascia tracce mentre è invisibile), luci danzanti, raggio di infermità (di 3º livello).
    attivita:
      - tipo: incantatore
        caratteristica: saggezza
        cd: 12
        a_volonta:
          - dnd.incantesimo.camuffare-se-stesso
          - dnd.incantesimo.illusione-minore
          - dnd.incantesimo.invisibilita
          - dnd.incantesimo.luci-danzanti
          - id: dnd.incantesimo.raggio-di-infermita
            livello: 3
