id: dnd.mostro.drago-d-argento-giovane
nome: Drago d'argento giovane
taglia: grande
tipo: drago
sottotipo: metallico
gruppo: Draghi d'argento
allineamento: legale buono
ca: {valore: 18}
caratteristiche:
  forza: {valore: 23, competenza: false}
  destrezza: {valore: 10, competenza: true}
  costituzione: {valore: 21, competenza: false}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 19, competenza: false}
iniziativa: competenza
dadi_vita: 16
velocita: {camminata: 12, volo: 24}
abilita: [furtivita: competenza, storia: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 9}
percezione_passiva: 18
immunita_danni: [freddo]
lingue: [Comune, Draconico]
gs: 9

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di Soffio paralizzante.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +10, portata 3 m. *Colpito:* 15 (2d8 + 6) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di freddo (ricarica 5-6)"
    id: soffio-di-freddo-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 17, tutte le creature in un cono di 9 metri. *Fallimento:* 49 (11d8) danni da freddo. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 11, dado: d8, tipo_danno: freddo}
        successo: danno-dimezzato
  - nome: Soffio paralizzante
    id: soffio-paralizzante
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 17, tutte le creature in un cono di 9 metri.

      *Primo fallimento:* il bersaglio è incapacitato fino al termine del proprio turno successivo. A quel punto, ripete il tiro salvezza.

      *Secondo fallimento:* il bersaglio è paralizzato e ripete il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Dopo 1 minuto, il tiro viene superato automaticamente.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
