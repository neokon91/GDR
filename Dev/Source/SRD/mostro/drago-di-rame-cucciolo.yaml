id: dnd.mostro.drago-di-rame-cucciolo
nome: Drago di rame cucciolo
taglia: media
tipo: drago
sottotipo: metallico
gruppo: Draghi di rame
allineamento: caotico buono
ca: {valore: 16}
caratteristiche:
  forza: {valore: 15, competenza: false}
  destrezza: {valore: 12, competenza: true}
  costituzione: {valore: 13, competenza: false}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 13, competenza: false}
iniziativa: competenza
dadi_vita: 4
velocita: {camminata: 9, scalata: 9, volo: 18}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 18, vista_cieca: 3}
percezione_passiva: 14
immunita_danni: [acido]
lingue: [Draconico]
gs: 1

azioni:
  - nome: Squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m. *Colpito:* 7 (1d10 + 2) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d10
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di acido (ricarica 5-6)"
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 11, tutte le creature in una linea lunga 6 metri e larga 1,5 metri. *Fallimento:* 18 (4d8) danni da acido. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: destrezza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 4, dado: d8, tipo_danno: acido}
        successo: danno-dimezzato
  - nome: Soffio rallentante
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 11, tutte le creature in un cono di 4,5 metri. *Fallimento:* il bersaglio non può effettuare reazioni, la sua velocità è dimezzata e nel suo turno può effettuare un'azione o un'azione bonus, non entrambe. L'effetto dura fino al termine del proprio turno successivo.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: destrezza, base: 8, competenza: true}
