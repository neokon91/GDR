id: dnd.mostro.triceratopo
nome: Triceratopo
taglia: enorme
tipo: bestia
sottotipo: dinosauro
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 14}
caratteristiche:
  forza: {valore: 22, competenza: false}
  destrezza: {valore: 9, competenza: false}
  costituzione: {valore: 17, competenza: false}
  intelligenza: {valore: 2, competenza: false}
  saggezza: {valore: 11, competenza: false}
  carisma: {valore: 5, competenza: false}
dadi_vita: 12
velocita: {camminata: 15}
percezione_passiva: 10
lingue: [nessuna]
gs: 5

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: trafiggere, ripetizioni: 2}
    descrizione: |
      Il triceratopo effettua due attacchi Trafiggere.
  - nome: Trafiggere
    id: trafiggere
    descrizione: |
      *Tiro per colpire in mischia:* +9, portata 1,5 m. *Colpito:* 19 (2d12 + 6) danni perforanti. Se il bersaglio è una creatura di taglia Enorme o inferiore e il triceratopo si è mosso di 6 metri o più in linea retta verso di esso subito prima del colpo, il bersaglio subisce 9 (2d8) danni perforanti extra e cade a terra prono.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d12
              tipo_danno: perforante
              bonus: {caratteristica: forza}
