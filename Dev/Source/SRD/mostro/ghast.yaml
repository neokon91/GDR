id: dnd.mostro.ghast
nome: Ghast
taglia: media
tipo: non-morto
allineamento: caotico malvagio
ca: {valore: 13}
caratteristiche:
  forza: {valore: 16, competenza: false}
  destrezza: {valore: 17, competenza: false}
  costituzione: {valore: 10, competenza: false}
  intelligenza: {valore: 11, competenza: false}
  saggezza: {valore: 10, competenza: true}
  carisma: {valore: 8, competenza: false}
dadi_vita: 8
velocita: {camminata: 9}
sensi: {scurovisione: 18}
percezione_passiva: 10
resistenze: [necrotico]
immunita_danni: [veleno]
immunita_condizioni: [affascinato, avvelenato, indebolimento]
lingue: [Comune]
gs: 2

tratti:
  - nome: Fetore
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 10, ogni creatura che inizi il suo turno in un'emanazione di 1,5 metri di cui il ghast è il punto di origine. *Fallimento:* il bersaglio è avvelenato fino all'inizio del proprio turno successivo. *Successo:* il bersaglio è immune a Fetore di questo ghast per 24 ore.
azioni:
  - nome: Artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m. *Colpito:* 10 (2d6 + 3) danni taglienti. Se il bersaglio è una creatura diversa da un non morto, subisce il seguente effetto.

      *Tiro salvezza su Costituzione:* CD 10. *Fallimento:* il bersaglio è paralizzato fino al termine del proprio turno successivo.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m. *Colpito:* 7 (1d8 + 3) danni perforanti più 9 (2d8) danni necrotici.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: perforante
              bonus: {caratteristica: forza}
