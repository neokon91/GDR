id: dnd.mostro.ragno
nome: Ragno
taglia: minuscola
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 12}
caratteristiche:
  forza: {valore: 2, competenza: false}
  destrezza: {valore: 14, competenza: false}
  costituzione: {valore: 8, competenza: false}
  intelligenza: {valore: 1, competenza: false}
  saggezza: {valore: 10, competenza: false}
  carisma: {valore: 2, competenza: false}
dadi_vita: 1
velocita: {camminata: 6, scalata: 6}
abilita: [furtivita: competenza]
sensi: {scurovisione: 9}
percezione_passiva: 10
lingue: [nessuna]
gs: 0

tratti:
  - nome: Andatura sulla ragnatela
    descrizione: |
      Il ragno ignora le restrizioni di movimento causate dalle ragnatele e conosce l'ubicazione di qualsiasi altra creatura a contatto con la medesima ragnatela.
  - nome: Movimenti del ragno
    descrizione: |
      Il ragno può scalare le superfici difficili, compresi i soffitti, senza effettuare una prova di caratteristica.
azioni:
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m *Colpito:* 1 danno perforante più 2 (1d4) danni da veleno.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          portata: 1.5
