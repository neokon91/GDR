id: dnd.mostro.ragno-fase
nome: Ragno-fase
taglia: grande
tipo: mostruosita
allineamento: senza allineamento
ca: {valore: 14}
caratteristiche:
  forza: {valore: 15, competenza: false}
  destrezza: {valore: 16, competenza: false}
  costituzione: {valore: 12, competenza: false}
  intelligenza: {valore: 6, competenza: false}
  saggezza: {valore: 10, competenza: false}
  carisma: {valore: 6, competenza: false}
dadi_vita: 7
velocita: {camminata: 9, scalata: 9}
abilita: [furtivita: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 10
lingue: [nessuna]
gs: 3

tratti:
  - nome: Andatura sulla ragnatela
    descrizione: |
      Il ragno ignora le restrizioni di movimento causate dalle ragnatele e conosce l'ubicazione di qualsiasi altra creatura a contatto con la medesima ragnatela.
  - nome: Movimenti del ragno
    descrizione: |
      Il ragno può scalare le superfici difficili, compresi i soffitti, senza effettuare una prova di caratteristica.
  - nome: Vista eterea
    descrizione: |
      Il ragno è in grado di vedere per 18 metri sul Piano Etereo finché si trova sul Piano Materiale e viceversa.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: morso, ripetizioni: 2}
    descrizione: |
      Il ragno effettua due attacchi Morso.
  - nome: Morso
    id: morso
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m *Colpito:* 8 (1d10 + 3) danni perforanti più 9 (2d8) danni da veleno. Se i danni riducono il bersaglio a 0 punti ferita, esso diventa stabile, ed è avvelenato per 1 ora. Finché è avvelenato, il bersaglio è anche paralizzato.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d10
              tipo_danno: perforante
              bonus: {caratteristica: destrezza}
azioni_bonus:
  - nome: Transizione eterea
    descrizione: |
      Il ragno si teletrasporta dal Piano Materiale al Piano Etereo o viceversa.
