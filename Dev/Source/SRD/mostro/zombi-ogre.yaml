id: dnd.mostro.zombi-ogre
nome: Zombi ogre
taglia: grande
tipo: non-morto
allineamento: neutrale malvagio
ca: {valore: 8}
caratteristiche:
  forza: {valore: 19, competenza: false}
  destrezza: {valore: 6, competenza: false}
  costituzione: {valore: 18, competenza: false}
  intelligenza: {valore: 3, competenza: false}
  saggezza: {valore: 6, competenza: true}
  carisma: {valore: 5, competenza: false}
dadi_vita: 9
velocita: {camminata: 9}
sensi: {scurovisione: 18}
percezione_passiva: 8
immunita_danni: [veleno]
immunita_condizioni: [avvelenato, indebolimento]
lingue: [capisce il Comune e il Gigante ma non li parla]
gs: 2

tratti:
  - nome: Tempra dei non morti
    descrizione: |
      Se i danni riducono lo zombi a 0 punti ferita, esso effettua un tiro salvezza su Costituzione (CD pari a 5 più i danni subiti), a meno che non si tratti di danni radiosi o di un colpo critico. In caso di successo, scende invece a 1 punto ferita.
azioni:
  - nome: Schianto
    descrizione: |
      *Tiro per colpire in mischia:* +6, portata 1,5 m. *Colpito:* 13 (2d8 + 4) danni contundenti.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: contundente
              bonus: {caratteristica: forza}
