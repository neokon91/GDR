id: dnd.mostro.sciame-di-insetti
nome: Sciame di insetti
taglia: media
sottodimensione: minuscole
tipo: sciame
sottotipo: di bestie
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 11}
caratteristiche:
  forza: {valore: 3, competenza: false}
  destrezza: {valore: 13, competenza: false}
  costituzione: {valore: 14, competenza: false}
  intelligenza: {valore: 1, competenza: false}
  saggezza: {valore: 7, competenza: false}
  carisma: {valore: 1, competenza: false}
dadi_vita: 3
velocita: {camminata: 6, scalata: 6}
sensi: {vista_cieca: 9}
percezione_passiva: 8
resistenze: [contundente, perforante, tagliente]
immunita_condizioni: [affascinato, afferrato, paralizzato, pietrificato, prono, spaventato, stordito, trattenuto]
lingue: [nessuna]
gs: 1/2

tratti:
  - nome: Movimenti del ragno
    descrizione: |
      Se lo sciame ha una velocità di scalata, può scalare le superfici difficili, compresi i soffitti, senza effettuare una prova di caratteristica.
  - nome: Sciame
    descrizione: |
      Lo sciame può occupare lo spazio di un'altra creatura e viceversa, e può muoversi attraverso qualsiasi apertura sufficientemente larga da far passare un insetto Minuscolo. L'orda non può recuperare punti ferita o ottenere punti ferita temporanei.
azioni:
  - nome: Morsi
    descrizione: |
      *Tiro per colpire in mischia:* +3, portata 1,5 m. *Colpito:* 6 (2d4 + 1) danni da veleno, o 3 (1d4 + 1) danni da veleno se lo sciame è sanguinante.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d4
              tipo_danno: veleno
              bonus: {caratteristica: destrezza}
