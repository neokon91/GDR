id: dnd.mostro.orsogufo
nome: Orsogufo
taglia: grande
tipo: mostruosita
allineamento: senza allineamento
ca: {valore: 13}
caratteristiche:
  forza: {valore: 20, competenza: false}
  destrezza: {valore: 12, competenza: false}
  costituzione: {valore: 17, competenza: false}
  intelligenza: {valore: 3, competenza: false}
  saggezza: {valore: 12, competenza: false}
  carisma: {valore: 7, competenza: false}
dadi_vita: 7
velocita: {camminata: 12, scalata: 12}
abilita: [percezione: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 15
lingue: [nessuna]
gs: 3

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 2}
    descrizione: |
      L'orsogufo effettua due attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +7, portata 1,5 m. *Colpito:* 14 (2d8 + 5) danni taglienti.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
