id: dnd.mostro.cinghiale-mannaro
nome: Cinghiale mannaro
taglia: [media, piccola]
tipo: mostruosita
sottotipo: licantropo
allineamento: neutrale malvagio
ca: {valore: 15}
caratteristiche:
  forza: {valore: 17, competenza: false}
  destrezza: {valore: 10, competenza: false}
  costituzione: {valore: 15, competenza: false}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 11, competenza: false}
  carisma: {valore: 8, competenza: false}
iniziativa: competenza
dadi_vita: 15
velocita: {camminata: 12}
abilita: [percezione: competenza]
percezione_passiva: 12
equipaggiamento:
  - {articolo: dnd.arma.giavellotto, quantita: 6}
lingue: ["Comune (non può parlare in forma di cinghiale)"]
gs: 4

azioni:
  - nome: Multiattacco
    descrizione: |
      Il cinghiale mannaro effettua due attacchi, usando Giavellotto o Zanne in qualsiasi combinazione. Può sostituire un attacco con un attacco Trafiggere.
  - nome: "Giavellotto (solo in forma umanoide o ibrida)"
    descrizione: |
      *Tiro per colpire in mischia o a distanza:* +5, portata 1,5 m o gittata 9/36 m. *Colpito:* 13 (3d6 + 3) danni perforanti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-distanza
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          usa: dnd.arma.giavellotto
          gittata: {normale: 9, lunga: 36}
        colpito:
          - danno:
              numero_dadi: 3
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: forza}
  - nome: "Trafiggere (solo in forma di cinghiale o ibrida)"
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m *Colpito:* 12 (2d8 + 3) danni perforanti. Se il bersaglio è un umanoide, subisce il seguente effetto. *Tiro salvezza su Costituzione:* CD 12. *Fallimento:* il bersaglio è maledetto. Se il bersaglio scende a 0 punti ferita, diventa un cinghiale mannaro sotto il controllo del GM e ha 10 punti ferita. *Successo:* il bersaglio è immune alla maledizione del cinghiale mannaro per 24 ore.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: perforante
              bonus: {caratteristica: forza}
  - nome: "Zanne (solo in forma di cinghiale o ibrida)"
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m *Colpito:* 10 (2d6 + 3) danni perforanti. Se il bersaglio è una creatura di taglia Media o inferiore e il cinghiale mannaro si è mosso di 6 metri o più in linea retta verso di esso subito prima del colpo, il bersaglio subisce 7 (2d6) danni perforanti extra e cade a terra prono.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: forza}
azioni_bonus:
  - nome: Mutaforma
    descrizione: |
      Il cinghiale mannaro si trasforma in un ibrido umanoide-cinghiale di taglia Media o in un cinghiale di taglia Piccola, altrimenti torna alla sua forma originale di umanoide. Le sue statistiche di gioco, a eccezione della taglia, restano le stesse in ogni forma. Nessun oggetto che indossa o trasporta viene trasformato.
