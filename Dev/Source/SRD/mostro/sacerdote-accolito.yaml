id: dnd.mostro.sacerdote-accolito
nome: Sacerdote accolito
taglia: [media, piccola]
tipo: umanoide
sottotipo: chierico
gruppo: Sacerdoti
allineamento: neutrale
ca: {valore: 13}
caratteristiche:
  forza: {valore: 14, competenza: false}
  destrezza: {valore: 10, competenza: false}
  costituzione: {valore: 12, competenza: false}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 14, competenza: false}
  carisma: {valore: 11, competenza: false}
dadi_vita: 2
velocita: {camminata: 9}
abilita: [medicina: competenza, religione: competenza]
percezione_passiva: 12
equipaggiamento:
  - {articolo: dnd.arma.mazza}
  - {articolo: dnd.armatura.giaco-di-maglia}
  - {articolo: dnd.oggetto.simbolo-sacro}
lingue: [Comune]
gs: 1/4

azioni:
  - nome: Mazza
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m *Colpito:* 5 (1d6 + 2) danni contundenti più 2 (1d4) danni radiosi.
    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-mischia
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          usa: dnd.arma.mazza
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d6
              tipo_danno: contundente
              bonus: {caratteristica: forza}
  - nome: Fiamma radiosa
    descrizione: |
      *Tiro per colpire a distanza:* +4, gittata 18 m. *Colpito:* 7 (2d6) danni radiosi.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
        colpito:
          - danno: {numero_dadi: 2, dado: d6, tipo_danno: radioso}
  - nome: Incantesimi
    descrizione: |
      Il sacerdote lancia uno dei seguenti incantesimi, utilizzando Saggezza come caratteristica da incantatore: A volontà: Luce, taumaturgia
    attivita:
      - tipo: incantatore
        caratteristica: saggezza
        a_volonta:
          - dnd.incantesimo.luce
          - dnd.incantesimo.taumaturgia
azioni_bonus:
  - nome: "Aiuto divino (1/giorno)"
    descrizione: |
      Il sacerdote lancia benedizione, parola guaritrice o santuario, utilizzando la stessa caratteristica da incantatore di Incantesimi.
