id: dnd.mostro.babbuino
nome: Babbuino
taglia: piccola
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 12}
caratteristiche:
  forza: {valore: 8, competenza: false}
  destrezza: {valore: 14, competenza: false}
  costituzione: {valore: 11, competenza: false}
  intelligenza: {valore: 4, competenza: false}
  saggezza: {valore: 12, competenza: false}
  carisma: {valore: 6, competenza: false}
dadi_vita: 1
velocita: {camminata: 9, scalata: 9}
lingue: [nessuna]
gs: 0
tratti:
  - id: babbuino.tattiche-del-branco
    nome: Tattiche del Branco
    descrizione: |
      Il babbuino dispone di Vantaggio a un tiro per colpire contro una creatura
      se almeno uno dei suoi alleati si trova entro 1,5 metri dalla creatura e non è Incapacitato.
azioni:
  - id: babbuino.morso
    nome: Morso
    descrizione: |
      *Tiro per Colpire in Mischia:* +1, portata 1,5 m.
      *Colpito:* 1 (1d4 - 1) danni Perforanti.
    attivita:
      - tipo: attacco
        attacco: { categoria: attacco-naturale, bonus: { caratteristica: forza, competenza: true }, bersagli: 1, portata: 1.5 }
        colpito:
          - danno: {numero_dadi: 1, dado: d4, tipo_danno: perforante, bonus: { caratteristica: forza } }
