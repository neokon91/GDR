id: dnd.mostro.drago-di-bronzo-giovane
nome: Drago di bronzo giovane
taglia: grande
tipo: drago
sottotipo: metallico
gruppo: Draghi di bronzo
allineamento: legale buono
ca: {valore: 17}
caratteristiche:
  forza: {valore: 21, competenza: false}
  destrezza: {valore: 10, competenza: true}
  costituzione: {valore: 19, competenza: false}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 13, competenza: true}
  carisma: {valore: 17, competenza: false}
iniziativa: competenza
dadi_vita: 15
velocita: {camminata: 12, nuoto: 12, volo: 24}
abilita: [furtivita: competenza, intuizione: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 9}
percezione_passiva: 17
immunita_danni: [fulmine]
lingue: [Comune, Draconico]
gs: 8

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di Soffio repulsivo.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +8, portata 3 m. *Colpito:* 16 (2d10 + 5) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d10
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di fulmini (ricarica 5-6)"
    id: soffio-di-fulmini-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 15, tutte le creature in una linea lunga 18 metri e larga 1,5 metri. *Fallimento:* 49 (9d10) danni da fulmine. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 9, dado: d10, tipo_danno: fulmine}
        successo: danno-dimezzato
  - nome: Soffio repulsivo
    id: soffio-repulsivo
    descrizione: |
      *Tiro salvezza su Forza:* CD 15, tutte le creature in un cono di 9 metri. *Fallimento:* il bersaglio viene spinto fino a un massimo di 12 metri di distanza dal drago e cade a terra prono.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: forza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
