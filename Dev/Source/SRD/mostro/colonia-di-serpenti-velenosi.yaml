id: dnd.mostro.colonia-di-serpenti-velenosi
nome: Colonia di serpenti velenosi
taglia: media
sottodimensione: minuscole
tipo: sciame
sottotipo: di bestie
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 14}
caratteristiche:
  forza: {valore: 8, competenza: false}
  destrezza: {valore: 18, competenza: false}
  costituzione: {valore: 11, competenza: false}
  intelligenza: {valore: 1, competenza: false}
  saggezza: {valore: 10, competenza: false}
  carisma: {valore: 3, competenza: false}
dadi_vita: 8
velocita: {camminata: 9, nuoto: 9}
sensi: {vista_cieca: 3}
percezione_passiva: 10
resistenze: [contundente, perforante, tagliente]
immunita_condizioni: [affascinato, afferrato, paralizzato, pietrificato, prono, spaventato, stordito, trattenuto]
lingue: [nessuna]
gs: 2

tratti:
  - nome: Sciame
    descrizione: |
      La colonia può occupare lo spazio di un'altra creatura e viceversa, e può muoversi attraverso qualsiasi apertura sufficientemente larga da far passare un serpente Minuscolo. L'orda non può recuperare punti ferita o ottenere punti ferita temporanei.
azioni:
  - nome: Morsi
    descrizione: |
      *Tiro per colpire in mischia:* +6, portata 1,5 m. *Colpito:* 8 (1d4 + 4) danni perforanti, o 6 (1d8 + 4) danni perforanti se la colonia è sanguinante, più 10 (3d6) danni da veleno.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d4
              tipo_danno: perforante
              bonus: {caratteristica: destrezza}
