id: dnd.mostro.ettercap
nome: Ettercap
taglia: media
tipo: mostruosita
allineamento: neutrale malvagio
ca: {valore: 13}
caratteristiche:
  forza: {valore: 14, competenza: false}
  destrezza: {valore: 15, competenza: false}
  costituzione: {valore: 13, competenza: false}
  intelligenza: {valore: 7, competenza: false}
  saggezza: {valore: 12, competenza: false}
  carisma: {valore: 8, competenza: false}
dadi_vita: 8
velocita: {camminata: 9, scalata: 9}
abilita: [furtivita: competenza, percezione: competenza, sopravvivenza: competenza]
sensi: {scurovisione: 18}
percezione_passiva: 13
lingue: [nessuna]
gs: 2

tratti:
  - nome: Andatura sulla ragnatela
    descrizione: |
      L'ettercap ignora le restrizioni di movimento causate dalle ragnatele e conosce l'ubicazione esatta di ogni altra creatura a contatto con la stessa ragnatela.
  - nome: Movimenti del ragno
    descrizione: |
      L'ettercap può scalare le superfici difficili, compresi i soffitti, senza effettuare una prova di caratteristica.
azioni:
  - nome: Multiattacco
    descrizione: |
      L'ettercap effettua un attacco Morso e un attacco Artiglio.
  - nome: Artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m. *Colpito:* 7 (2d4 + 2) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d4
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m. *Colpito:* 5 (1d6 + 2) danni perforanti più 2 (1d4) danni da veleno, e il bersaglio è avvelenato fino all'inizio del turno successivo dell'ettercap.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: forza}
  - nome: "Filo di ragnatela (ricarica 5-6)"
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 12, una creatura di taglia Grande o inferiore che l'ettercap è in grado di vedere entro 9 metri. *Fallimento:* il bersaglio è trattenuto finché la ragnatela non viene distrutta (CA 10; PF 5; vulnerabilità ai danni da fuoco; immunità ai danni contundenti, psichici e da veleno).
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: forza, base: 8, competenza: true}
azioni_bonus:
  - nome: Riavvolgere
    descrizione: |
      L'ettercap attira in linea retta verso di sé una creatura entro 9 metri trattenuta dal suo Filo di ragnatela per un massimo di 7,5 metri.
