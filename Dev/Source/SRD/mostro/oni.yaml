id: dnd.mostro.oni
nome: Oni
taglia: grande
tipo: immondo
allineamento: legale malvagio
ca: {valore: 17}
caratteristiche:
  forza: {valore: 19, competenza: false}
  destrezza: {valore: 11, competenza: true}
  costituzione: {valore: 16, competenza: true}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 12, competenza: true}
  carisma: {valore: 15, competenza: true}
dadi_vita: 14
velocita: {camminata: 9, volo: 9}
abilita: [arcano: competenza, percezione: competenza, inganno: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 14
resistenze: [freddo]
lingue: [Comune, Gigante]
gs: 7

tratti:
  - nome: Rigenerazione
    descrizione: |
      L'oni recupera 10 punti ferita all'inizio di ogni suo turno, se ha almeno 1 punto ferita.
azioni:
  - nome: Multiattacco
    descrizione: |
      L'oni effettua due attacchi Artiglio o Raggio dell'incubo. Può sostituire un attacco con un utilizzo di Incantesimi.
  - nome: Artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +7, portata 3 m. *Colpito:* 10 (1d12 + 4) danni taglienti più 9 (2d8) danni necrotici.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 1
              dado: d12
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Raggio dell'incubo
    descrizione: |
      *Tiro per colpire a distanza:* +5, gittata 18 m. *Colpito:* 9 (2d6 + 2) danni psichici, e il bersaglio è spaventato fino all'inizio del turno successivo dell'oni.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: intelligenza, competenza: true}
          bersagli: 1
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: psichico
              bonus: {caratteristica: intelligenza}
  - nome: Incantesimi
    descrizione: |
      L'oni lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 13): 1/giorno ciascuno: Charme su persone (di 2º livello), forma gassosa, oscurità, sonno
    attivita:
      - tipo: incantatore
        caratteristica: carisma
        cd: 13
        al_giorno:
          - usi: 1
            incantesimi:
              - id: dnd.incantesimo.charme-su-persone
                livello: 2
              - dnd.incantesimo.forma-gassosa
              - dnd.incantesimo.oscurita
              - dnd.incantesimo.sonno
  - nome: Mutaforma
    descrizione: |
      L'oni si trasforma in un umanoide di taglia Piccola o Media, o in un gigante di taglia Grande, oppure torna alla sua vera forma. A eccezione della taglia, le sue statistiche di gioco restano le stesse in ogni forma. Nessun oggetto che indossa o trasporta viene trasformato.
azioni_bonus:
  - nome: Invisibilità
    descrizione: |
      L'oni lancia invisibilità su se stesso, senza bisogno di componenti e utilizzando la stessa caratteristica da incantatore di Incantesimi.
