id: dnd.mostro.fantasma
nome: Fantasma
taglia: media
tipo: non-morto
allineamento: neutrale
ca: {valore: 11}
caratteristiche:
  forza: {valore: 7, competenza: false}
  destrezza: {valore: 13, competenza: false}
  costituzione: {valore: 10, competenza: false}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 12, competenza: false}
  carisma: {valore: 17, competenza: false}
dadi_vita: 10
velocita: {camminata: 5, volo: 12}
sensi: {scurovisione: 18}
percezione_passiva: 11
resistenze: [acido, contundente, freddo, fulmine, fuoco, perforante, tagliente, tuono]
immunita_danni: [necrotico, veleno, perforante, tagliente, tuono]
immunita_condizioni: [affascinato, afferrato, avvelenato, indebolimento, paralizzato, pietrificato, prono, spaventato, trattenuto]
lingue: [Comune più un'altra lingua]
gs: 4

tratti:
  - nome: Movimento incorporeo
    descrizione: |
      Il fantasma può muoversi attraverso altri oggetti o creature come se fossero terreno difficile. Se termina il suo turno all'interno di un oggetto, subisce 5 (1d10) danni da forza.
  - nome: Vista eterea
    descrizione: |
      Quando si trova sul Piano Materiale, il fantasma è in grado di vedere per 18 metri sul Piano Etereo.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: tocco-inaridente, ripetizioni: 2}
    descrizione: |
      Il fantasma effettua due attacchi Tocco inaridente.
  - nome: Tocco inaridente
    id: tocco-inaridente
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m. *Colpito:* 19 (3d10 + 3) danni necrotici.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: carisma, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 3
              dado: d10
              tipo_danno: necrotico
              bonus: {caratteristica: carisma}
  - nome: Forma eterea
    id: forma-eterea
    descrizione: |
      Il fantasma lancia l'incantesimo forma eterea, senza bisogno di componenti, utilizzando Carisma come caratteristica da incantatore. Finché si trova sul Confine Etereo, il fantasma è visibile sul Piano Materiale e viceversa, ma non può influenzare o essere influenzato da nulla di quanto accade sull'altro piano.
  - nome: "Possessione (ricarica 6)"
    id: possessione-ricarica-6
    descrizione: |
      *Tiro salvezza su Carisma:* CD 13, un umanoide che il fantasma è in grado di vedere entro 1,5 metri. *Fallimento:* il bersaglio è posseduto dal fantasma; il fantasma scompare e il bersaglio è incapacitato e perde il controllo del suo corpo. Ora il fantasma controlla il corpo del bersaglio, ma senza privarlo della sua consapevolezza. Il fantasma non può essere il bersaglio di alcun attacco, incantesimo o altro effetto, ad eccezione di quelli che bersagliano specificatamente i non morti. Le statistiche di gioco del fantasma sono le stesse, ma il fantasma usa la velocità e i modificatori di Forza, Destrezza e Costituzione del bersaglio. La possessione dura finché il corpo non scende a 0 punti ferita o il fantasma non lo abbandona con un'azione bonus. Quando la possessione termina, il fantasma riappare in uno spazio libero entro 1,5 metri dal bersaglio, e il bersaglio è immune alla Possessione di questo fantasma per 24 ore. *Successo:* Il bersaglio è immune alla Possessione di questo fantasma per 24 ore.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: carisma
          cd: {caratteristica: carisma, base: 8, competenza: true}
  - nome: Volto terrificante
    id: volto-terrificante
    descrizione: |
      *Tiro salvezza su Saggezza:* CD 13, tutte le creature in un cono di 18 metri in grado di vedere il fantasma e diverse da un non morto. *Fallimento:* 10 (2d6 + 3) danni psichici, e il bersaglio è spaventato fino all'inizio del turno successivo del fantasma. *Successo:* Il bersaglio è immune al Volto terrificante di questo fantasma per 24 ore.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: saggezza
          cd: {caratteristica: carisma, base: 8, competenza: true}
