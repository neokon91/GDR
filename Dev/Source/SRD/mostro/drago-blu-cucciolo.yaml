id: dnd.mostro.drago-blu-cucciolo
nome: Drago blu cucciolo
taglia: media
tipo: drago
sottotipo: cromatico
gruppo: Draghi blu
allineamento: legale malvagio
ca: {valore: 17}
caratteristiche:
  forza: {valore: 17, competenza: false}
  destrezza: {valore: 10, competenza: true}
  costituzione: {valore: 15, competenza: false}
  intelligenza: {valore: 12, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 15, competenza: false}
iniziativa: competenza
dadi_vita: 10
velocita: {camminata: 5, volo: 18}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 18, vista_cieca: 3}
percezione_passiva: 14
immunita_danni: [fulmine]
lingue: [Draconico]
gs: 3

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 2}
    descrizione: |
      Il drago effettua due attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m. *Colpito:* 8 (1d10 + 3) danni taglienti più 3 (1d6) danni da fulmine.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d10
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di fulmini (ricarica 5-6)"
    id: soffio-di-fulmini-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 12, tutte le creature in una linea lunga 9 metri e larga 1,5 metri. *Fallimento:* 21 (6d6) danni da fulmine. *Successo:* danni dimezzati.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 6, dado: d6, tipo_danno: fulmine}
        successo: danno-dimezzato
