id: dnd.mostro.banco-di-piranha
nome: Banco di Piranha
taglia: media
sottodimensione: minuscole
tipo: sciame
sottotipo: di bestie
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 13}
caratteristiche:
  forza: {valore: 13, competenza: false}
  destrezza: {valore: 16, competenza: false}
  costituzione: {valore: 9, competenza: false}
  intelligenza: {valore: 1, competenza: false}
  saggezza: {valore: 7, competenza: false}
  carisma: {valore: 2, competenza: false}
dadi_vita: 8
velocita: {camminata: 5, nuoto: 12}
sensi: {scurovisione: 18}
resistenze: [contundente, perforante, tagliente]
immunita_condizioni: [affascinato, afferrato, paralizzato, pietrificato, prono, spaventato, stordito, trattenuto]
lingue: [nessuna]
gs: 1
tratti:
  - id: banco-di-piranha.respirare-sott-acqua
    nome: Respirare sott'acqua
    descrizione: |
      Il banco può respirare soltanto sott'acqua.
  - id: banco-di-piranha.sciame
    nome: Sciame
    descrizione: |
      Il banco di pesci può occupare lo spazio di un'altra creatura e viceversa,
      e può muoversi attraverso qualsiasi apertura abbastanza grande per un piranha di taglia Minuscola.
      L'orda non può recuperare punti ferita o ottenere punti ferita temporanei.
azioni:
  - id: banco-di-piranha.morsi
    nome: Morsi
    descrizione: |
      *Tiro per Colpire in Mischia:* +5 (con Vantaggio se il bersaglio non ha tutti i punti ferita), portata 1,5 m.
      *Colpito:* 8 (2d4 + 3) danni Perforanti, o 5 (1d4 + 3) danni Perforanti se il banco è Sanguinante.
    attivita:
      - tipo: attacco
        attacco: { categoria: attacco-naturale, bonus: { caratteristica: destrezza, competenza: true }, bersagli: 1, portata: 1.5 }
        colpito:
          - danno: {numero_dadi: 2, dado: d4, tipo_danno: perforante, bonus: { caratteristica: destrezza } }
