id: dnd.mostro.mulo
nome: Mulo
taglia: media
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 10}
caratteristiche:
  forza: {valore: 14, competenza: true}
  destrezza: {valore: 10, competenza: false}
  costituzione: {valore: 13, competenza: false}
  intelligenza: {valore: 2, competenza: false}
  saggezza: {valore: 10, competenza: false}
  carisma: {valore: 5, competenza: false}
dadi_vita: 2
velocita: {camminata: 12}
percezione_passiva: 10
lingue: [nessuna]
gs: 1/8

tratti:
  - nome: Bestia da soma
    descrizione: |
      Per determinare la sua capacità di carico, il mulo è considerato come se fosse di una categoria di taglia superiore.
azioni:
  - nome: Zoccoli
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m. *Colpito:* 4 (1d4 + 2) danni contundenti.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d4
              tipo_danno: contundente
              bonus: {caratteristica: forza}
