id: dnd.mostro.driade
nome: Driade
taglia: media
tipo: folletto
allineamento: neutrale
ca: {valore: 16}
caratteristiche:
  forza: {valore: 10, competenza: false}
  destrezza: {valore: 12, competenza: false}
  costituzione: {valore: 11, competenza: false}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 15, competenza: false}
  carisma: {valore: 18, competenza: false}
dadi_vita: 5
velocita: {camminata: 9}
abilita: [percezione: competenza, furtivita: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 14
lingue: [Elfico, Silvano]
gs: 1

tratti:
  - nome: Parlare con bestie e vegetali
    descrizione: |
      La driade può comunicare con le bestie e i vegetali come se condividesse con loro una lingua.
  - nome: Resistenza alla magia
    descrizione: |
      La driade dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
azioni:
  - nome: Multiattacco
    descrizione: |
      La driade effettua un attacco Sferzata di rampicante o Esplosione di spine, e può usare Incantesimi per lanciare charme sui mostri.
  - nome: Sferzata di rampicante
    descrizione: |
      *Tiro per colpire in mischia:* +6, portata 3 m. *Colpito:* 8 (1d8 + 4) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: carisma, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: carisma}
  - nome: Esplosione di spine
    descrizione: |
      *Tiro per colpire a distanza:* +6, gittata 18 m. *Colpito:* 7 (1d6 + 4) danni perforanti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: carisma, competenza: true}
          bersagli: 1
        colpito:
          - danno:
              numero_dadi: 1
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: carisma}
  - nome: Incantesimi
    descrizione: |
      La driade lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 14):

      *1/giorno ciascuno:*
      - intralciare
      - passare senza tracce

      *A volontà:*
      - amicizia con gli animali
      - artificio druidico
      - charme sui mostri (dura 24 ore; termina in anticipo se la driade lancia nuovamente l'incantesimo)
    attivita:
      - tipo: incantatore
        caratteristica: carisma
        cd: 14
        a_volonta:
          - dnd.incantesimo.amicizia-con-gli-animali
          - dnd.incantesimo.artificio-druidico
          - dnd.incantesimo.charme-sui-mostri
        al_giorno:
          - usi: 1
            incantesimi:
              - dnd.incantesimo.intralciare
              - dnd.incantesimo.passare-senza-tracce
azioni_bonus:
  - nome: Passo arboreo
    descrizione: |
      Se si trova entro 1,5 metri da un albero di taglia Grande o superiore, la driade si teletrasporta in uno spazio libero entro 1,5 metri da un secondo albero di taglia Grande o superiore che si trova entro 18 metri dall'altro albero.
