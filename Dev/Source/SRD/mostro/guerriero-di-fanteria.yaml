id: dnd.mostro.guerriero-di-fanteria
nome: Guerriero di fanteria
taglia: [media, piccola]
tipo: umanoide
gruppo: Guerrieri
allineamento: neutrale
ca: {valore: 13}
caratteristiche:
  forza: {valore: 13, competenza: false}
  destrezza: {valore: 11, competenza: false}
  costituzione: {valore: 11, competenza: false}
  intelligenza: {valore: 8, competenza: false}
  saggezza: {valore: 11, competenza: false}
  carisma: {valore: 8, competenza: false}
dadi_vita: 2
velocita: {camminata: 9}
percezione_passiva: 10
equipaggiamento:
  - {articolo: dnd.armatura.giaco-di-maglia}
  - {articolo: dnd.arma.lancia}
lingue: [Comune]
gs: 1/8

tratti:
  - nome: Tattiche del branco
    descrizione: |
      Il guerriero dispone di vantaggio a un tiro per colpire contro una creatura se almeno uno dei suoi alleati si trova entro 1,5 metri dalla creatura e non è incapacitato.
azioni:
  - nome: Lancia
    descrizione: |
      *Tiro per colpire in mischia o a distanza:* +3, portata 1,5 m o gittata 6/18 m. *Colpito:* 4 (1d6 + 1) danni perforanti.

    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-distanza
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          usa: dnd.arma.lancia
          gittata: {normale: 6, lunga: 18}
        colpito:
          - danno:
              numero_dadi: 1
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: forza}
