id: dnd.mostro.gladiatore
nome: Gladiatore
taglia: [media, piccola]
tipo: umanoide
allineamento: neutrale
ca: {valore: 16}
caratteristiche:
  forza: {valore: 18, competenza: true}
  destrezza: {valore: 15, competenza: true}
  costituzione: {valore: 16, competenza: true}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 12, competenza: true}
  carisma: {valore: 15, competenza: false}
iniziativa: competenza
dadi_vita: 15
velocita: {camminata: 9}
abilita: [intrattenere: competenza, atletica: maestria]
percezione_passiva: 11
equipaggiamento:
  - {articolo: dnd.armatura.armatura-di-cuoio-borchiato}
  - {articolo: dnd.arma.lancia, quantita: 3}
  - {articolo: dnd.armatura.scudo}
lingue: [Comune]
gs: 5

azioni:
  - nome: Multiattacco
    descrizione: |
      Il gladiatore effettua tre attacchi Lancia. Può sostituire un attacco con un utilizzo di Scudo da sfondamento.
  - nome: Lancia
    descrizione: |
      *Tiro per colpire in mischia o a distanza:* +7, portata 1,5 m o gittata 6/18 m. *Colpito:* 11 (2d6 + 4) danni perforanti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-distanza
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          usa: dnd.arma.lancia
          gittata: {normale: 6, lunga: 18}
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: forza}
  - nome: Scudo da sfondamento
    descrizione: |
      *Tiro salvezza su Forza:* CD 15, una creatura entro 1,5 metri che il gladiatore è in grado di vedere. *Fallimento:* 9 (2d4 + 4) danni contundenti. Se il bersaglio è una creatura di taglia Media o inferiore, cade a terra prono.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: forza
          cd: {caratteristica: forza, base: 8, competenza: true}
reazioni:
  - nome: Parata
    descrizione: |
      *Attivazione:* il gladiatore viene colpito da un tiro per colpire in mischia mentre tiene in mano un'arma.

      *Esito:* il gladiatore aggiunge 3 alla sua CA contro quell'attacco, aumentando le probabilità che il colpo non vada a segno.
