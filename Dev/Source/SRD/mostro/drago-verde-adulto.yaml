id: dnd.mostro.drago-verde-adulto
nome: Drago verde adulto
taglia: enorme
tipo: drago
sottotipo: cromatico
gruppo: Draghi verdi
allineamento: legale malvagio
ca: {valore: 19}
caratteristiche:
  forza: {valore: 23, competenza: false}
  destrezza: {valore: 12, competenza: true}
  costituzione: {valore: 21, competenza: false}
  intelligenza: {valore: 18, competenza: false}
  saggezza: {valore: 15, competenza: true}
  carisma: {valore: 18, competenza: false}
iniziativa: maestria
dadi_vita: 18
velocita: {camminata: 12, nuoto: 12, volo: 24}
abilita: [furtivita: competenza, inganno: competenza, persuasione: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 18}
percezione_passiva: 22
immunita_danni: [veleno]
immunita_condizioni: [avvelenato]
lingue: [Comune, Draconico]
gs: 15

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
  - nome: "Resistenza leggendaria (3/giorno o 4/giorno nella tana)"
    descrizione: |
      Se il drago fallisce un tiro salvezza, può scegliere di superarlo comunque.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di Incantesimi per lanciare aculeo mentale (di 3º livello).
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +11, portata 3 m. *Colpito:* 15 (2d8 + 6) danni taglienti più 7 (2d6) danni da veleno.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Incantesimi
    id: incantesimi
    descrizione: |
      Il drago lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 17):

      *1/Giorno:* [[incantesimi/costrizione]]

      *A Volontà:* [[incantesimi/aculeo-mentale]] (di 3º livello), [[incantesimi/individuazione-del-magico]]
  - nome: "Soffio di veleno (ricarica 5-6)"
    id: soffio-di-veleno-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 18, tutte le creature in un cono di 18 metri. *Fallimento:* 56 (16d6) danni da veleno. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 16, dado: d6, tipo_danno: veleno}
        successo: danno-dimezzato
azioni_leggendarie_utilizzi: {numero: 3, nella_tana: 4, ricarica: inizio-turno-proprio}
azioni_leggendarie:
  - id: balzo
    nome: Balzo
    descrizione: |
      Il drago si muove fino a metà della sua velocità, ed effettua un attacco Squarcio.
    attivita:
      - tipo: azione-leggendaria
        costo: 1
        effetti:
          - {azione: squarcio}
  - id: invasione-mentale
    nome: Invasione mentale
    descrizione: |
      Il drago usa Incantesimi per lanciare aculeo mentale (di 3º livello).
    attivita:
      - tipo: incantatore
        costo: 1
        cd: 17
        a_volonta:
          - {id: aculeo-mentale, livello: 3}
  - id: miasma-nocivo
    nome: Miasma nocivo
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 17, tutte le creature in una Sfera di 6 metri di raggio centrata su un punto che il drago è in grado di vedere entro 27 metri.
      *Fallimento:* 7 (2d6) danni da Veleno, e il bersaglio subisce una penalità di -2 alla CA fino al termine del proprio turno successivo.
      *Fallimento o Successo:* il drago non può ripetere quest'azione fino all'inizio del proprio turno successivo.
    attivita:
      - tipo: tiro-salvezza
        costo: 1
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: intelligenza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 2, dado: d6, tipo_danno: veleno}
