id: dnd.mostro.bugbear-cacciatore
nome: Bugbear Cacciatore
taglia: media
tipo: folletto
sottotipo: goblinoide
gruppo: Bugbear
allineamento: caotico malvagio
ca: {valore: 15}
caratteristiche:
  forza: {valore: 17, competenza: false}
  destrezza: {valore: 14, competenza: false}
  costituzione: {valore: 14, competenza: true}
  intelligenza: {valore: 11, competenza: false}
  saggezza: {valore: 12, competenza: true}
  carisma: {valore: 11, competenza: false}
dadi_vita: 10
velocita: {camminata: 9}
abilita: [sopravvivenza: competenza, furtivita: maestria]
sensi: {scurovisione: 18}
equipaggiamento: [giaco di maglia, "giavellotti (6)", mazza chiodata]
lingue: [comune, goblin]
gs: 3
tratti:
  - id: bugbear-cacciatore.rapimento
    nome: Rapimento
    descrizione: Il bugbear non ha bisogno di usare movimento extra per spostare una creatura che sta afferrando.
azioni:
  - id: bugbear-cacciatore.multiattacco
    nome: Multiattacco
    descrizione: Il bugbear effettua due attacchi Giavellotto o Mazza chiodata.
  - id: bugbear-cacciatore.giavellotto
    nome: Giavellotto
    descrizione: |
      *Tiro per Colpire in Mischia o a Distanza:* +5, portata 3 m o gittata 9/36 m.
      *Colpito:* 13 (3d6 + 3) danni Perforanti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-distanza
          bonus: { caratteristica: forza, competenza: true }
          bersagli: 1
          usa: dnd.arma.giavellotto
          gittata: {normale: 9, lunga: 36}
        colpito:
          - danno: { numero_dadi: 3, dado: d6, tipo_danno: perforante, bonus: { caratteristica: forza } }
  - id: bugbear-cacciatore.mazza-chiodata
    nome: Mazza Chiodata
    descrizione: |
      *Tiro per Colpire in Mischia:* +5 (con Vantaggio se il bersaglio è Afferrato dal bugbear), portata 3 m.
      *Colpito:* 12 (2d8 + 3) danni Perforanti.
    attivita:
      - tipo: attacco
        attacco: { categoria: arma-mischia, bonus: { caratteristica: forza, competenza: true }, bersagli: 1, usa: dnd.arma.mazza-chiodata, portata: 3 }
        colpito:
          - danno: { numero_dadi: 2, dado: d8, tipo_danno: perforante, bonus: { caratteristica: forza } }
azioni_bonus:
  - id: bugbear-cacciatore.presa-rapida
    nome: Presa Rapida
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 13, una creatura di taglia Media o inferiore che il bugbear è in grado di vedere entro 3 metri da sé.
      *Fallimento:* il bersaglio è Afferrato (CD 13 per sfuggire).
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: { caratteristica: forza, base: 8, competenza: true }
