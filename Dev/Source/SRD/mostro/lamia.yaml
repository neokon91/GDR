id: dnd.mostro.lamia
nome: Lamia
taglia: grande
tipo: immondo
allineamento: caotico malvagio
ca: {valore: 13}
caratteristiche:
  forza: {valore: 16, competenza: false}
  destrezza: {valore: 13, competenza: false}
  costituzione: {valore: 15, competenza: false}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 15, competenza: false}
  carisma: {valore: 16, competenza: false}
dadi_vita: 13
velocita: {camminata: 12}
abilita: [intuizione: competenza, inganno: maestria, furtivita: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 12
lingue: [Abissale, Comune]
gs: 4

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: artiglio, ripetizioni: 2}
    descrizione: |
      Il lamia effettua due attacchi Artiglio. Può sostituire un attacco con un utilizzo di Tocco corruttore.
  - nome: Artiglio
    id: artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m *Colpito:* 7 (1d8 + 3) danni taglienti più 7 (2d6) danni psichici.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Incantesimi
    id: incantesimi
    descrizione: |
      Il lamia lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 13): 1/giorno ciascuno: Costrizione, immagine maggiore, scrutare A volontà: Camuffare se stesso (può apparire come un bipede di taglia Grande o Media), illusione minore
    attivita:
      - tipo: incantatore
        caratteristica: carisma
        cd: 13
        a_volonta:
          - dnd.incantesimo.camuffare-se-stesso
          - dnd.incantesimo.illusione-minore
        al_giorno:
          - usi: 1
            incantesimi:
              - dnd.incantesimo.costrizione
              - dnd.incantesimo.immagine-maggiore
              - dnd.incantesimo.scrutare
  - nome: Tocco corruttore
    id: tocco-corruttore
    descrizione: |
      *Tiro salvezza su Saggezza:* CD 13, una creatura che il lamia è in grado di vedere entro 1,5 metri. *Fallimento:* 13 (3d8) danni psichici, e il bersaglio è maledetto per 1 ora. Finché la maledizione perdura, il bersaglio è affascinato e avvelenato.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: saggezza
          cd: {caratteristica: forza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 3, dado: d8, tipo_danno: psichico}
azioni_bonus:
  - nome: Balzo
    descrizione: |
      Il lamia salta fino a 9 metri usando 3 metri di movimento.
