id: dnd.mostro.drago-bianco-giovane
nome: Drago bianco giovane
taglia: grande
tipo: drago
sottotipo: cromatico
gruppo: Draghi bianchi
allineamento: caotico malvagio
ca: {valore: 17}
caratteristiche:
  forza: {valore: 18, competenza: false}
  destrezza: {valore: 10, competenza: true}
  costituzione: {valore: 18, competenza: false}
  intelligenza: {valore: 6, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 12, competenza: false}
iniziativa: competenza
dadi_vita: 13
velocita: {scavo: 6, nuoto: 12, volo: 24}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 9}
percezione_passiva: 16
immunita_danni: [freddo]
lingue: [Draconico]
gs: 6

tratti:
  - nome: Camminare sul ghiaccio
    descrizione: |
      Il drago può muoversi sulle superfici di ghiaccio e scalarle senza bisogno di effettuare una prova di caratteristica. Inoltre, un terreno difficile costituito da ghiaccio o neve non gli costa alcun movimento aggiuntivo.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +7, portata 3 m. *Colpito:* 9 (2d4 + 4) danni taglienti più 2 (1d4) danni da freddo.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d4
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di freddo (ricarica 5-6)"
    id: soffio-di-freddo-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 15, tutte le creature in un cono di 9 metri. *Fallimento:* 40 (9d8) danni da freddo. *Successo:* danni dimezzati.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: forza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 9, dado: d8, tipo_danno: freddo}
        successo: danno-dimezzato
