id: dnd.mostro.tarrasque
nome: Tarrasque
taglia: mastodontica
tipo: mostruosita
sottotipo: titano
allineamento: senza allineamento
ca: {valore: 25}
caratteristiche:
  forza: {valore: 30, competenza: false}
  destrezza: {valore: 11, competenza: true}
  costituzione: {valore: 30, competenza: false}
  intelligenza: {valore: 3, competenza: true}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 11, competenza: true}
iniziativa: maestria
dadi_vita: 34
velocita: {scavo: 12, scalata: 18}
abilita: [percezione: competenza]
sensi: {vista_cieca: 36}
percezione_passiva: 19
resistenze: [contundente, perforante, tagliente]
immunita_danni: [fuoco, veleno]
immunita_condizioni: [affascinato, assordato, avvelenato, paralizzato, spaventato]
lingue: [nessuna]
gs: 30

tratti:
  - nome: Carapace riflettente
    descrizione: |
      Se il tarrasque è bersagliato da un incantesimo dardo incantato o un incantesimo che richiede un tiro per colpire a distanza, tira 1d6. Con un risultato di 1-5, il tarrasque non subisce alcun effetto. Con un risultato di 6, il tarrasque non subisce alcun effetto e riflette l'incantesimo contro l'incantatore, rendendolo il suo bersaglio.
  - nome: Mostro da assedio
    descrizione: |
      Il tarrasque infligge danni doppi a oggetti e strutture.
  - nome: Resistenza alla magia
    descrizione: |
      Il tarrasque dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
  - nome: "Resistenza leggendaria (6/giorno)"
    descrizione: |
      Se il tarrasque fallisce un tiro salvezza, può scegliere di superarlo comunque.
azioni:
  - nome: Multiattacco
    descrizione: |
      Il tarrasque effettua un attacco Morso e altri tre attacchi, usando Artiglio o Coda in qualsiasi combinazione.
  - nome: Artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +19, portata 4,5 m. *Colpito:* 28 (4d8 + 10) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 4.5
        colpito:
          - danno:
              numero_dadi: 4
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Coda
    descrizione: |
      *Tiro per colpire in mischia:* +19, portata 9 m. *Colpito:* 23 (3d8 + 10) danni contundenti. Se il bersaglio è una creatura di taglia Enorme o inferiore, cade a terra prono.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 9
        colpito:
          - danno:
              numero_dadi: 3
              dado: d8
              tipo_danno: contundente
              bonus: {caratteristica: forza}
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +19, portata 4,5 m. *Colpito:* 36 (4d12 + 10) danni perforanti, e il bersaglio è afferrato (CD 20 per sfuggire). Finché la presa perdura, il bersaglio è trattenuto e non può teletrasportarsi.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 4.5
        colpito:
          - danno:
              numero_dadi: 4
              dado: d12
              tipo_danno: perforante
              bonus: {caratteristica: forza}
  - nome: "Ruggito tonante (ricarica 5-6)"
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 27, ogni creatura e oggetto che non sia indossato o trasportato in un cono di 45 metri. *Fallimento:* 78 (12d12) danni da tuono, e il bersaglio è assordato e spaventato fino al termine del proprio turno successivo. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: forza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 12, dado: d12, tipo_danno: tuono}
        successo: danno-dimezzato
azioni_bonus:
  - nome: Inghiottire
    descrizione: |
      *Tiro salvezza su Forza:* CD 27, una creatura di taglia Grande o inferiore afferrata dal tarrasque (può inghiottire fino a sei creature per volta). *Fallimento:* il bersaglio viene inghiottito e non è più afferrato. Una creatura inghiottita è accecata e trattenuta e non può teletrasportarsi, ha copertura totale contro attacchi e altri effetti al di fuori del tarrasque e subisce 56 (16d6) danni da acido all'inizio di ogni turno del tarrasque. Se il tarrasque subisce 60 o più danni in un singolo turno da una creatura al suo interno, deve superare un tiro salvezza su Costituzione con CD 20 alla fine di quel turno, altrimenti rigurgita tutte le creature inghiottite, ognuna delle quali cade a terra prona in uno spazio entro 3 metri dal tarrasque. Se il tarrasque muore, qualsiasi creatura inghiottita non è più trattenuta e può fuggire dal cadavere usando 6 metri di movimento, uscendo prona.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: forza
          cd: {caratteristica: forza, base: 8, competenza: true}
azioni_leggendarie:
  - nome: "Utilizzi di azioni leggendarie: 3 Subito dopo il turno di un'altra creatura, il tarrasque può consumare un utilizzo per effettuare una delle seguenti azioni. Il tarrasque recupera tutti gli utilizzi consumati all'inizio di ogni suo turno."
    descrizione: |

  - nome: Assalto brutale
    descrizione: |
      Il tarrasque si muove fino a metà della sua velocità ed effettua un attacco Artiglio e un attacco Coda.
  - nome: Movimento sismico
    descrizione: |
      Il tarrasque si muove fino alla sua velocità massima. Alla fine di questo movimento, crea un'onda d'urto istantanea in un'emanazione di 18 metri di cui il tarrasque è il punto di origine. Le creature in quell'area perdono la concentrazione e, se sono di taglia Media o inferiore, cadono a terra prone. Il tarrasque non può ripetere quest'azione fino all'inizio del proprio turno successivo.
