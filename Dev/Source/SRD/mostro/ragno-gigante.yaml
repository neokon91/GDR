id: dnd.mostro.ragno-gigante
nome: Ragno gigante
taglia: grande
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 14}
caratteristiche:
  forza: {valore: 14, competenza: false}
  destrezza: {valore: 16, competenza: false}
  costituzione: {valore: 12, competenza: false}
  intelligenza: {valore: 2, competenza: false}
  saggezza: {valore: 11, competenza: false}
  carisma: {valore: 4, competenza: false}
dadi_vita: 4
velocita: {camminata: 9, scalata: 9}
abilita: [furtivita: maestria, percezione: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 14
lingue: [nessuna]
gs: 1

tratti:
  - nome: Andatura sulla ragnatela
    descrizione: |
      Il ragno ignora le restrizioni di movimento causate dalle ragnatele e conosce l'ubicazione esatta di ogni altra creatura a contatto con la stessa ragnatela.
  - nome: Movimenti del ragno
    descrizione: |
      Il ragno può scalare le superfici difficili, compresi i soffitti, senza effettuare una prova di caratteristica.
azioni:
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m *Colpito:* 7 (1d8 + 3) danni perforanti più 7 (2d6) danni da veleno.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: perforante
              bonus: {caratteristica: destrezza}
  - nome: "Ragnatela (ricarica 5-6)"
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 13, una creatura che il ragno è in grado di vedere entro 18 metri. *Fallimento:* il bersaglio è trattenuto finché la ragnatela non viene distrutta (CA 10; PF 5; vulnerabilità ai danni da fuoco; immunità ai danni da veleno e psichici).

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: destrezza, base: 8, competenza: true}
