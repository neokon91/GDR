id: dnd.mostro.drago-blu-adulto
nome: Drago blu adulto
taglia: enorme
tipo: drago
sottotipo: cromatico
gruppo: Draghi blu
allineamento: legale malvagio
ca: {valore: 19}
caratteristiche:
  forza: {valore: 25, competenza: false}
  destrezza: {valore: 10, competenza: true}
  costituzione: {valore: 23, competenza: false}
  intelligenza: {valore: 16, competenza: false}
  saggezza: {valore: 15, competenza: true}
  carisma: {valore: 20, competenza: false}
iniziativa: maestria
dadi_vita: 17
velocita: {scavo: 9, volo: 24}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 18}
percezione_passiva: 22
immunita_danni: [fulmine]
lingue: [Comune, Draconico]
gs: 16

tratti:
  - nome: "Resistenza leggendaria (3/giorno o 4/giorno nella tana)"
    descrizione: |
      Se il drago fallisce un tiro salvezza, può scegliere di superarlo comunque.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di Incantesimi per lanciare frantumare.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +12, portata 3 m. *Colpito:* 16 (2d8 + 7) danni taglienti più 5 (1d10) danni da fulmine.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Incantesimi
    id: incantesimi
    descrizione: |
      Il drago lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 18):

      1/giorno ciascuno:
      - inviare
      - scrutare

      A volontà:
      - frantumare
      - individuazione del magico
      - invisibilità
      - mano magica
    attivita:
      - tipo: incantatore
        caratteristica: carisma
        cd: 18
        a_volonta:
          - dnd.incantesimo.frantumare
          - dnd.incantesimo.individuazione-del-magico
          - dnd.incantesimo.invisibilita
          - dnd.incantesimo.mano-magica
        al_giorno:
          - usi: 1
            incantesimi:
              - dnd.incantesimo.inviare
              - dnd.incantesimo.scrutare
  - nome: "Soffio di fulmini (ricarica 5-6)"
    id: soffio-di-fulmini-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 19, tutte le creature in una linea lunga 27 metri e larga 1,5 metri. *Fallimento:* 60 (11d10) danni da fulmine. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 11, dado: d10, tipo_danno: fulmine}
        successo: danno-dimezzato
azioni_leggendarie:
  - nome: "Utilizzi di azioni leggendarie 3 (4 nella tana)"
    descrizione: |
      Subito dopo il turno di un'altra creatura, il drago può consumare un utilizzo per effettuare una delle seguenti azioni. Il drago recupera tutti gli utilizzi consumati all'inizio di ogni suo turno.
  - nome: Boato sonico
    descrizione: |
      Il drago usa Incantesimi per lanciare frantumare. Il drago non può ripetere quest'azione fino all'inizio del proprio turno successivo.
  - nome: Spazzata di coda
    descrizione: |
      Il drago effettua un attacco Squarcio.
  - nome: Volo celato
    descrizione: |
      Il drago usa Incantesimi per lanciare invisibilità su se stesso, e può volare fino a metà della sua velocità di volo. Il drago non può ripetere quest'azione fino all'inizio del proprio turno successivo.
