id: dnd.mostro.ankheg
nome: Ankheg
taglia: grande
tipo: mostruosita
allineamento: senza allineamento
ca: {valore: 14}
caratteristiche:
  forza: {valore: 17, competenza: false}
  destrezza: {valore: 11, competenza: false}
  costituzione: {valore: 14, competenza: false}
  intelligenza: {valore: 1, competenza: false}
  saggezza: {valore: 13, competenza: false}
  carisma: {valore: 6, competenza: false}
dadi_vita: 6
velocita: {camminata: 9, scavo: 3}
sensi: {percezione_tellurica: 18, scurovisione: 18}
lingue: [nessuna]
gs: 2
habitat: [foresta, prateria]
tratti:
  - id: ankheg.scavatore-di-tunnel
    nome: Scavatore di tunnel
    descrizione: |
      L'ankheg può scavare nella roccia a metà della sua Velocità di Scavo
      e lascia dietro di sé un tunnel del diametro di 3 metri.
azioni:
  - id: ankheg.morso
    nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +5 (con Vantaggio se il bersaglio è afferrato dall'ankheg), portata 1,5 m.
      *Colpito:* 10 (2d6 + 3) danni Taglienti più 3 (1d6) danni da Acido.
      Se il bersaglio è una creatura di taglia Grande o inferiore, è Afferrato (CD 13 per sfuggire).
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - id: ankheg.spruzzo-acido
    nome: "Spruzzo acido (ricarica 6)"
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 12, tutte le creature in una Linea
      lunga 9 metri e larga 1,5 metri.
      *Fallimento:* 14 (4d6) danni da Acido.
      *Successo:* Danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 4, dado: d6, tipo_danno: acido}
        successo: danno-dimezzato
