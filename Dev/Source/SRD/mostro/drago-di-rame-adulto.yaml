id: dnd.mostro.drago-di-rame-adulto
nome: Drago di rame adulto
taglia: enorme
tipo: drago
sottotipo: metallico
gruppo: Draghi di rame
allineamento: caotico buono
ca: {valore: 18}
caratteristiche:
  forza: {valore: 23, competenza: false}
  destrezza: {valore: 12, competenza: true}
  costituzione: {valore: 21, competenza: false}
  intelligenza: {valore: 18, competenza: false}
  saggezza: {valore: 15, competenza: true}
  carisma: {valore: 18, competenza: false}
iniziativa: maestria
dadi_vita: 16
velocita: {camminata: 12, scalata: 12, volo: 24}
abilita: [furtivita: competenza, inganno: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 18}
percezione_passiva: 22
immunita_danni: [acido]
lingue: [Comune, Draconico]
gs: 14

tratti:
  - nome: "Resistenza leggendaria (3/giorno o 4/giorno nella tana)"
    descrizione: |
      Se il drago fallisce un tiro salvezza, può scegliere di superarlo comunque.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di (A) Soffio rallentante o (B) Incantesimi per lanciare aculeo mentale (di 4º livello).
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +11, portata 3 m. *Colpito:* 17 (2d10 + 6) danni taglienti più 4 (1d8) danni da acido.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d10
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Incantesimi
    id: incantesimi
    descrizione: |
      Il drago lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 17):

      *1/giorno ciascuno:*
      - immagine maggiore
      - ristorare superiore

      *A volontà:*
      - aculeo mentale (di 4º livello)
      - illusione minore
      - individuazione del magico
      - trasformazione (solo in forma di bestia o umanoide, senza punti ferita temporanei ottenuti dall'incantesimo, e senza richiedere concentrazione o punti ferita temporanei per mantenere l'incantesimo)
    attivita:
      - tipo: incantatore
        caratteristica: carisma
        cd: 17
        a_volonta:
          - id: dnd.incantesimo.aculeo-mentale
            livello: 4
          - dnd.incantesimo.illusione-minore
          - dnd.incantesimo.individuazione-del-magico
          - dnd.incantesimo.trasformazione
        al_giorno:
          - usi: 1
            incantesimi:
              - dnd.incantesimo.immagine-maggiore
              - dnd.incantesimo.ristorare-superiore
  - nome: "Soffio di acido (ricarica 5-6)"
    id: soffio-di-acido-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 18, tutte le creature in una linea lunga 18 metri e larga 1,5 metri. *Fallimento:* 54 (12d8) danni da acido. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 12, dado: d8, tipo_danno: acido}
        successo: danno-dimezzato
  - nome: Soffio rallentante
    id: soffio-rallentante
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 18, tutte le creature in un cono di 18 metri. *Fallimento:* il bersaglio non può effettuare reazioni, la sua velocità è dimezzata e nel suo turno può effettuare un'azione o un'azione bonus, non entrambe. L'effetto dura fino al termine del proprio turno successivo.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
azioni_leggendarie:
  - nome: "Utilizzi di azioni leggendarie 3 (4 nella tana)"
    descrizione: |
      Subito dopo il turno di un'altra creatura, il drago può consumare un utilizzo per effettuare una delle seguenti azioni. Il drago recupera tutti gli utilizzi consumati all'inizio di ogni suo turno.
  - nome: Balzo
    descrizione: |
      Il drago si muove fino a metà della sua velocità, ed effettua un attacco Squarcio.
  - nome: Magia ridacchiante
    descrizione: |
      *Tiro salvezza su Carisma:* CD 17, una creatura che il drago è in grado di vedere entro 27 metri. *Fallimento:* 24 (7d6) danni psichici. Fino al termine del proprio turno successivo, il bersaglio tira 1d6 ogni volta che effettua una prova di caratteristica o un tiro per colpire e sottrae il risultato dalla prova con d20. *Fallimento o successo:* il drago non può ripetere quest'azione fino all'inizio del proprio turno successivo.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: carisma
          cd: {caratteristica: intelligenza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 7, dado: d6, tipo_danno: psichico}
  - nome: Scossa mentale
    descrizione: |
      Il drago usa Incantesimi per lanciare aculeo mentale (di 4º livello). Il drago non può ripetere quest'azione fino all'inizio del proprio turno successivo.
