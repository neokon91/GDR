id: dnd.mostro.capitano-dei-pirati
nome: Capitano dei Pirati
taglia: [media, piccola]
tipo: umanoide
gruppo: Pirati
allineamento: neutrale
ca: {valore: 17}
caratteristiche:
  forza: {valore: 10, competenza: true}
  destrezza: {valore: 18, competenza: true}
  costituzione: {valore: 14, competenza: false}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 14, competenza: true}
  carisma: {valore: 17, competenza: true}
iniziativa: competenza
dadi_vita: 13
velocita: {camminata: 9}
abilita: [acrobazia: competenza, percezione: competenza]
equipaggiamento: [pistola, stocco]
lingue: [Comune più un'altra lingua]
gs: 6
azioni:
  - id: capitano-dei-pirati.multiattacco
    nome: Multiattacco
    descrizione: Il pirata effettua tre attacchi, usando Stocco o Pistola in qualsiasi combinazione.
  - id: capitano-dei-pirati.
    nome: Stocco
    descrizione: |
      *Tiro per Colpire in Mischia:* +7, portata 1,5 m.
      *Colpito:* 13 (2d8 + 4) danni Perforanti, e il pirata dispone di Vantaggio al tiro per colpire successivo che effettua prima del termine del proprio turno corrente.
    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-mischia
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          usa: dnd.arma.stocco
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: perforante
              bonus: {caratteristica: destrezza}
  - id: capitano-dei-pirati.pistola
    nome: Pistola
    descrizione: |
      *Tiro per Colpire a Distanza:* +7, gittata 9/27 m.
      *Colpito:* 15 (2d10 + 4) danni Perforanti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-distanza
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          usa: dnd.arma.pistola
          gittata: {normale: 9, lunga: 27}
        colpito:
          - danno:
              numero_dadi: 2
              dado: d10
              tipo_danno: perforante
              bonus: {caratteristica: destrezza}
azioni_bonus:
  - id: capitano-dei-pirati.fascino-del-capitano
    nome: Fascino del Capitano
    descrizione: |
      *Tiro Salvezza su Saggezza:* CD 14, una creatura che il pirata è in grado di vedere entro 9 metri.
      *Fallimento:* Il bersaglio è Affascinato fino all'inizio del turno successivo del pirata.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: saggezza
          cd: {caratteristica: carisma, base: 8, competenza: true}
reazioni:
  - id: capitano-dei-pirati.replica
    nome: Replica
    descrizione: |
      *Attivazione:* il pirata viene colpito da un tiro per colpire in mischia mentre tiene in mano un'arma.
      *Esito:* il pirata aggiunge 3 alla sua CA contro quell'attacco,
      aumentando le probabilità che il colpo non vada a segno.
      Se il colpo non va a segno, il pirata effettua un attacco Stocco contro la creatura che ha provocato la reazione se si trova entro gittata.
