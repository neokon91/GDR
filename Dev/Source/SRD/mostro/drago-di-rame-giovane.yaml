id: dnd.mostro.drago-di-rame-giovane
nome: Drago di rame giovane
taglia: grande
tipo: drago
sottotipo: metallico
gruppo: Draghi di rame
allineamento: caotico buono
ca: {valore: 17}
caratteristiche:
  forza: {valore: 19, competenza: false}
  destrezza: {valore: 12, competenza: true}
  costituzione: {valore: 17, competenza: false}
  intelligenza: {valore: 16, competenza: false}
  saggezza: {valore: 13, competenza: true}
  carisma: {valore: 15, competenza: false}
iniziativa: competenza
dadi_vita: 14
velocita: {camminata: 12, scalata: 12, volo: 24}
abilita: [furtivita: competenza, inganno: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 9}
percezione_passiva: 17
immunita_danni: [acido]
lingue: [Comune, Draconico]
gs: 7

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di Soffio rallentante.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +7, portata 3 m. *Colpito:* 15 (2d10 + 4) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d10
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di acido (ricarica 5-6)"
    id: soffio-di-acido-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 14, tutte le creature in una linea lunga 12 metri e larga 1,5 metri. *Fallimento:* 40 (9d8) danni da acido. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 9, dado: d8, tipo_danno: acido}
        successo: danno-dimezzato
  - nome: Soffio rallentante
    id: soffio-rallentante
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 14, tutte le creature in un cono di 9 metri. *Fallimento:* il bersaglio non può effettuare reazioni, la sua velocità è dimezzata e nel suo turno può effettuare un'azione o un'azione bonus, non entrambe. L'effetto dura fino al termine del proprio turno successivo.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
