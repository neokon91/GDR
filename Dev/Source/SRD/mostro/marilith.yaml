id: dnd.mostro.marilith
nome: Marilith
taglia: grande
tipo: immondo
sottotipo: demone
allineamento: caotico malvagio
ca: {valore: 16}
caratteristiche:
  forza: {valore: 18, competenza: true}
  destrezza: {valore: 20, competenza: false}
  costituzione: {valore: 20, competenza: true}
  intelligenza: {valore: 18, competenza: false}
  saggezza: {valore: 16, competenza: true}
  carisma: {valore: 20, competenza: true}
iniziativa: competenza
dadi_vita: 21
velocita: {camminata: 12, scalata: 12}
abilita: [percezione: competenza]
sensi: {vista_pura: 36, telepatia: 36}
percezione_passiva: 18
resistenze: [freddo, fulmine, fuoco]
immunita_danni: [veleno]
immunita_condizioni: [avvelenato]
lingue: [Abissale]
gs: 16

tratti:
  - nome: Reattiva
    descrizione: |
      Il marilith può effettuare una reazione a ogni turno in combattimento.
  - nome: Resistenza alla magia
    descrizione: |
      Il marilith dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
  - nome: Ristoro demoniaco
    descrizione: |
      Se il marilith muore al di fuori dell'Abisso, il suo corpo si dissolve diventando icore e ne acquisisce uno nuovo all'istante, tornando in vita con tutti i suoi punti ferita da qualche parte nell'Abisso.
azioni:
  - nome: Multiattacco
    descrizione: |
      Il marilith effettua sei attacchi Lama del patto e usa Stritolare.
  - nome: Lama del patto
    descrizione: |
      *Tiro per colpire in mischia:* +10, portata 1,5 m. *Colpito:* 10 (1d8 + 5) danni taglienti più 7 (2d6) danni necrotici.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: destrezza}
  - nome: Stritolare
    descrizione: |
      *Tiro salvezza su Forza:* CD 17, una creatura di taglia Media o inferiore che il marilith è in grado di vedere entro 1,5 metri. *Fallimento:* 15 (2d10 + 4) danni contundenti. Il bersaglio è afferrato (CD 14 per sfuggire) ed è trattenuto finché la presa perdura.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: forza
          cd: {caratteristica: forza, base: 8, competenza: true}
azioni_bonus:
  - nome: "Teletrasporto (ricarica 5-6)"
    descrizione: |
      Il marilith si teletrasporta fino a massimo di 36 metri in uno spazio libero che è in grado di vedere.
reazioni:
  - nome: Parata
    descrizione: |
      Attivazione: il marilith viene colpito da un tiro per colpire in mischia mentre tiene in mano un'arma. Esito: il marilith aggiunge 5 alla sua CA contro quell'attacco, aumentando le probabilità che il colpo non vada a segno.
