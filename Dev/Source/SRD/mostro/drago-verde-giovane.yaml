id: dnd.mostro.drago-verde-giovane
nome: Drago verde giovane
taglia: grande
tipo: drago
sottotipo: cromatico
gruppo: Draghi verdi
allineamento: legale malvagio
ca: {valore: 18}
caratteristiche:
  forza: {valore: 19, competenza: false}
  destrezza: {valore: 12, competenza: true}
  costituzione: {valore: 17, competenza: false}
  intelligenza: {valore: 16, competenza: false}
  saggezza: {valore: 13, competenza: true}
  carisma: {valore: 15, competenza: false}
iniziativa: competenza
dadi_vita: 16
velocita: {camminata: 12, nuoto: 12, volo: 24}
abilita: [furtivita: competenza, inganno: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 9}
percezione_passiva: 17
immunita_danni: [veleno]
immunita_condizioni: [avvelenato]
lingue: [Comune, Draconico]
gs: 8

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +7, portata 3 m. *Colpito:* 11 (2d6 + 4) danni taglienti più 7 (2d6) danni da veleno.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di veleno (ricarica 5-6)"
    id: soffio-di-veleno-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 14, tutte le creature in un cono di 9 metri. *Fallimento:* 42 (12d6) danni da veleno. *Successo:* danni dimezzati.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 12, dado: d6, tipo_danno: veleno}
        successo: danno-dimezzato
