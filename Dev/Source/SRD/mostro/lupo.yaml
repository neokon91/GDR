id: dnd.mostro.lupo
nome: Lupo
taglia: media
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 12}
caratteristiche:
  forza: {valore: 14, competenza: false}
  destrezza: {valore: 15, competenza: false}
  costituzione: {valore: 12, competenza: false}
  intelligenza: {valore: 3, competenza: false}
  saggezza: {valore: 12, competenza: false}
  carisma: {valore: 6, competenza: false}
dadi_vita: 2
velocita: {camminata: 12}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 15
lingue: [nessuna]
gs: 1/4

tratti:
  - nome: Tattiche del branco
    descrizione: |
      Il lupo dispone di vantaggio ai tiri per colpire contro una creatura se almeno uno degli alleati dell'animale si trova entro 1,5 metri dalla creatura e non è incapacitato.
azioni:
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m. *Colpito:* 5 (1d6 + 2) danni perforanti. Se il bersaglio è una creatura di taglia Media o inferiore, cade a terra prono.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d6
              tipo_danno: perforante
              bonus: {caratteristica: forza}
