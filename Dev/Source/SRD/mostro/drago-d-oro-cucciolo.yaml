id: dnd.mostro.drago-d-oro-cucciolo
nome: Drago d'oro cucciolo
taglia: media
tipo: drago
sottotipo: metallico
gruppo: Draghi d'oro
allineamento: legale buono
ca: {valore: 17}
caratteristiche:
  forza: {valore: 19, competenza: false}
  destrezza: {valore: 14, competenza: true}
  costituzione: {valore: 17, competenza: false}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 16, competenza: false}
iniziativa: competenza
dadi_vita: 8
velocita: {camminata: 9, nuoto: 9, volo: 18}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 18, vista_cieca: 3}
percezione_passiva: 14
immunita_danni: [fuoco]
lingue: [Draconico]
gs: 3

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 2}
    descrizione: |
      Il drago effettua due attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +6, portata 1,5 m. *Colpito:* 9 (1d10 + 4) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d10
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di fuoco (ricarica 5-6)"
    id: soffio-di-fuoco-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 13, tutte le creature in un cono di 4,5 metri. *Fallimento:* 22 (4d10) danni da fuoco. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 4, dado: d10, tipo_danno: fuoco}
        successo: danno-dimezzato
  - nome: Soffio indebolente
    id: soffio-indebolente
    descrizione: |
      *Tiro salvezza su Forza:* CD 13, ogni creatura che al momento non è sotto l'effetto di questo soffio in un cono di 4,5 metri. *Fallimento:* il bersaglio subisce svantaggio alle prove con d20 basate sulla Forza e sottrae 2 (1d4) ai tiri per i danni. La creatura ripete il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Dopo 1 minuto, il tiro viene superato automaticamente.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: forza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
