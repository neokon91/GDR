id: dnd.mostro.corvo
nome: Corvo
taglia: minuscola
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 12}
caratteristiche:
  forza: {valore: 2, competenza: false}
  destrezza: {valore: 14, competenza: false}
  costituzione: {valore: 10, competenza: false}
  intelligenza: {valore: 5, competenza: false}
  saggezza: {valore: 13, competenza: false}
  carisma: {valore: 6, competenza: false}
dadi_vita: 1
velocita: {camminata: 3, volo: 15}
abilita: [percezione: competenza]
percezione_passiva: 13
lingue: [nessuna]
