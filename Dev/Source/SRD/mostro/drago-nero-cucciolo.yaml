id: dnd.mostro.drago-nero-cucciolo
nome: Drago nero cucciolo
taglia: media
tipo: drago
sottotipo: cromatico
gruppo: Draghi neri
allineamento: caotico malvagio
ca: {valore: 17}
caratteristiche:
  forza: {valore: 15, competenza: false}
  destrezza: {valore: 14, competenza: true}
  costituzione: {valore: 13, competenza: false}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 13, competenza: false}
iniziativa: competenza
dadi_vita: 6
velocita: {camminata: 9, nuoto: 9, volo: 18}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 18, vista_cieca: 3}
percezione_passiva: 14
immunita_danni: [acido]
lingue: [Draconico]
gs: 2

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 2}
    descrizione: |
      Il drago effettua due attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m. *Colpito:* 5 (1d6 + 2) danni taglienti più 2 (1d4) danni da acido.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di acido (ricarica 5-6)"
    id: soffio-di-acido-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 11, tutte le creature in una linea lunga 4,5 metri e larga 1,5 metri. *Fallimento:* 22 (5d8) danni da acido. *Successo:* danni dimezzati.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 5, dado: d8, tipo_danno: acido}
        successo: danno-dimezzato
