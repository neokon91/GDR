id: dnd.mostro.sfinge-della-conoscenza
nome: Sfinge della conoscenza
taglia: grande
tipo: celestiale
gruppo: Sfingi
allineamento: legale neutrale
ca: {valore: 17}
caratteristiche:
  forza: {valore: 18, competenza: false}
  destrezza: {valore: 15, competenza: false}
  costituzione: {valore: 16, competenza: false}
  intelligenza: {valore: 18, competenza: false}
  saggezza: {valore: 18, competenza: false}
  carisma: {valore: 18, competenza: false}
iniziativa: maestria
dadi_vita: 20
velocita: {camminata: 12, volo: 18}
abilita: [percezione: competenza, arcano: maestria, religione: maestria, storia: maestria]
sensi: {vista_pura: 36}
percezione_passiva: 18
resistenze: [necrotico, radioso]
immunita_danni: [psichico]
immunita_condizioni: [affascinato, spaventato]
lingue: [Celestiale, Comune]
gs: 11

tratti:
  - nome: Imperscrutabile
    descrizione: |
      Nessuna magia può consentire di osservare la sfinge da lontano o individuarne i pensieri senza il suo permesso. Le prove di Saggezza (Intuizione) effettuate per accertare le sue intenzioni o la sua sincerità subiscono svantaggio.
  - nome: "Resistenza leggendaria (3/giorno o 4/giorno nella tana)"
    descrizione: |
      Se la sfinge fallisce un tiro salvezza, può scegliere di superarlo comunque.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: artiglio, ripetizioni: 3}
    descrizione: |
      La sfinge effettua tre attacchi Artiglio.
  - nome: Artiglio
    id: artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +8, portata 1,5 m. *Colpito:* 14 (3d6 + 4) danni taglienti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 3
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Incantesimi
    id: incantesimi
    descrizione: |
      La sfinge lancia uno dei seguenti incantesimi senza bisogno di componenti materiali, utilizzando Intelligenza come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 16):1/giorno ciascuno: conoscenza delle leggende, dissolvi magie, linguaggi, localizza oggetto, rimuovi maledizione, spostamento planareA volontà: identificare, illusione minore, individuazione del magico, mano magica, prestidigitazione
    attivita:
      - tipo: incantatore
        caratteristica: intelligenza
        cd: 16
        a_volonta:
          - dnd.incantesimo.identificare
          - dnd.incantesimo.illusione-minore
          - dnd.incantesimo.individuazione-del-magico
          - dnd.incantesimo.mano-magica
          - dnd.incantesimo.prestidigitazione
        al_giorno:
          - usi: 1
            incantesimi:
              - dnd.incantesimo.conoscenza-delle-leggende
              - dnd.incantesimo.dissolvi-magie
              - dnd.incantesimo.linguaggi
              - dnd.incantesimo.localizza-oggetto
              - dnd.incantesimo.rimuovi-maledizione
              - dnd.incantesimo.spostamento-planare
  - nome: "Ruggito spezza-mente (ricarica 5-6)"
    id: ruggito-spezza-mente-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Saggezza:* CD 16, tutti i nemici in un'emanazione di 90 metri di cui la sfinge è il punto di origine. *Fallimento:* 35 (10d6) danni psichici, e il bersaglio è incapacitato fino all'inizio del turno successivo della sfinge.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: saggezza
          cd: {caratteristica: forza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 10, dado: d6, tipo_danno: psichico}
azioni_leggendarie:
  - nome: "Utilizzi di azioni leggendarie: 3 (4 nella tana)"
    descrizione: |
      Subito dopo il turno di un'altra creatura, la sfinge può consumare un utilizzo per effettuare una delle seguenti azioni. La sfinge recupera tutti gli utilizzi consumati all'inizio di ogni suo turno.
  - nome: Agguato arcano
    descrizione: |
      La sfinge può teletrasportarsi fino a 9 metri in uno spazio libero che è in grado di vedere, effettuando un attacco Artiglio.
  - nome: Peso degli anni
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 16, una creatura che la sfinge è in grado di vedere entro 36 metri. *Fallimento:* il bersaglio ottiene 1 livello di indebolimento. Finché il bersaglio ha uno o più livelli di indebolimento, apparirà più vecchio di 3d10 anni. *Fallimento o successo:* la sfinge non può ripetere quest'azione fino all'inizio del proprio turno successivo.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: forza, base: 8, competenza: true}
