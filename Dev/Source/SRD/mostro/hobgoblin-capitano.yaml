id: dnd.mostro.hobgoblin-capitano
nome: Hobgoblin capitano
taglia: media
tipo: folletto
sottotipo: goblinoide
gruppo: Hobgoblin
allineamento: legale malvagio
ca: {valore: 17}
caratteristiche:
  forza: {valore: 15, competenza: false}
  destrezza: {valore: 14, competenza: false}
  costituzione: {valore: 14, competenza: false}
  intelligenza: {valore: 12, competenza: false}
  saggezza: {valore: 10, competenza: false}
  carisma: {valore: 13, competenza: false}
iniziativa: competenza
dadi_vita: 9
velocita: {camminata: 9}
sensi: {scurovisione: 18}
percezione_passiva: 10
equipaggiamento:
  - {articolo: dnd.arma.arco-lungo}
  - {articolo: dnd.armatura.mezza-armatura}
  - {articolo: dnd.arma.spadone}
lingue: [Comune, Goblin]
gs: 3

tratti:
  - nome: Presenza autoritaria
    descrizione: |
      Finché si trovano in un'emanazione di 3 metri di cui l'hobgoblin è il punto di origine, l'hobgoblin e i suoi alleati dispongono di vantaggio ai tiri per colpire e ai tiri salvezza, ammesso che l'hobgoblin non sia incapacitato.
azioni:
  - nome: Multiattacco
    descrizione: |
      L'hobgoblin effettua due attacchi, utilizzando Spadone o Arco lungo in qualsiasi combinazione.
  - nome: Spadone
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m *Colpito:* 9 (2d6 + 2) danni taglienti più 3 (1d6) danni da veleno.
    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-mischia
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          usa: dnd.arma.spadone
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Arco lungo
    descrizione: |
      *Tiro per colpire a distanza:* +4, gittata 45/180 m. *Colpito:* 6 (1d8 + 2) danni perforanti più 5 (2d4) danni da veleno.

    attivita:
      - tipo: attacco
        attacco:
          categoria: arma-distanza
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          usa: dnd.arma.arco-lungo
          gittata: {normale: 45, lunga: 180}
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: perforante
              bonus: {caratteristica: forza}
