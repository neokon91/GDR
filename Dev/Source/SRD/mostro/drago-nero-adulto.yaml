id: dnd.mostro.drago-nero-adulto
nome: Drago nero adulto
taglia: enorme
tipo: drago
sottotipo: cromatico
gruppo: Draghi neri
allineamento: caotico malvagio
ca: {valore: 19}
caratteristiche:
  forza: {valore: 23, competenza: false}
  destrezza: {valore: 14, competenza: true}
  costituzione: {valore: 21, competenza: false}
  intelligenza: {valore: 14, competenza: false}
  saggezza: {valore: 13, competenza: true}
  carisma: {valore: 19, competenza: false}
iniziativa: maestria
dadi_vita: 17
velocita: {camminata: 12, nuoto: 12, volo: 24}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 18}
percezione_passiva: 21
immunita_danni: [acido]
lingue: [Comune, Draconico]
gs: 14

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
  - nome: "Resistenza leggendaria (3/giorno o 4/giorno nella tana)"
    descrizione: |
      Se il drago fallisce un tiro salvezza, può scegliere di superarlo comunque.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio. Può sostituire un attacco con un utilizzo di Incantesimi per lanciare freccia acida (di 3º livello).
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +11, portata 3 m. *Colpito:* 13 (2d6 + 6) danni taglienti più 4 (1d8) danni da acido.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d6
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Incantesimi
    id: incantesimi
    descrizione: |
      Il drago lancia uno dei seguenti incantesimi, senza bisogno di componenti materiali, utilizzando Carisma come caratteristica da incantatore (CD del tiro salvezza sull'incantesimo 17, +9 al tiro per colpire degli attacchi con incantesimo):

      *1/giorno ciascuno:*
      - parlare con i morti
      - sfera al vetriolo

      *A volontà:*
      - freccia acida (di 3º livello)
      - individuazione del magico
      - paura
    attivita:
      - tipo: incantatore
        caratteristica: carisma
        cd: 17
        a_volonta:
          - id: dnd.incantesimo.freccia-acida
            livello: 3
          - dnd.incantesimo.individuazione-del-magico
          - dnd.incantesimo.paura
        al_giorno:
          - usi: 1
            incantesimi:
              - dnd.incantesimo.parlare-con-i-morti
              - dnd.incantesimo.sfera-al-vetriolo
  - nome: "Soffio di acido (ricarica 5-6)"
    id: soffio-di-acido-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 18, tutte le creature in una linea lunga 18 metri e larga 1,5 metri. *Fallimento:* 54 (12d8) danni da acido. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 12, dado: d8, tipo_danno: acido}
        successo: danno-dimezzato
azioni_leggendarie:
  - nome: "Utilizzi di azioni leggendarie 3 (4 nella tana)"
    descrizione: |
      Subito dopo il turno di un'altra creatura, il drago può consumare un utilizzo per effettuare una delle seguenti azioni. Il drago recupera tutti gli utilizzi consumati all'inizio di ogni suo turno.
  - nome: Balzo
    descrizione: |
      Il drago si muove fino a metà della sua velocità ed effettua un attacco Squarcio.
  - nome: Nugolo di insetti
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 17, una creatura che il drago è in grado di vedere entro 36 metri. *Fallimento:* 22 (4d10) danni da veleno, e il bersaglio subisce svantaggio ai tiri salvezza per mantenere la concentrazione fino al termine del proprio turno successivo. *Fallimento o successo:* il drago non può ripetere quest'azione fino all'inizio del proprio turno successivo.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: carisma, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 4, dado: d10, tipo_danno: veleno}
  - nome: Presenza terrificante
    descrizione: |
      Il drago usa Incantesimi per lanciare paura. Il drago non può ripetere quest'azione fino all'inizio del proprio turno successivo.
