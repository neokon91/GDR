id: dnd.mostro.mephit-del-vapore
nome: Mephit del vapore
taglia: piccola
tipo: elementale
gruppo: Mephit
allineamento: neutrale malvagio
ca: {valore: 10}
caratteristiche:
  forza: {valore: 5, competenza: false}
  destrezza: {valore: 11, competenza: false}
  costituzione: {valore: 10, competenza: false}
  intelligenza: {valore: 11, competenza: false}
  saggezza: {valore: 10, competenza: false}
  carisma: {valore: 12, competenza: false}
dadi_vita: 5
velocita: {camminata: 9, volo: 9}
abilita: [furtivita: competenza]
sensi: {scurovisione: 18}
percezione_passiva: 10
immunita_danni: [fuoco, veleno]
immunita_condizioni: [avvelenato, indebolimento]
lingue: ["Primordiale (Aquan, Ignan)"]
gs: 1/4

tratti:
  - nome: Esplosione mortale
    descrizione: |
      Il mephit esplode quando muore. *Tiro salvezza su Destrezza:* CD 10, tutte le creature in un'emanazione di 1,5 metri di cui il mephit è il punto di origine. *Fallimento:* 5 (2d4) danni da fuoco. *Successo:* danni dimezzati.
  - nome: Forma sfocata
    descrizione: |
      I tiri per colpire contro il mephit sono effettuati con svantaggio, a meno che il mephit non sia incapacitato.
azioni:
  - nome: Artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +2, portata 1,5 m. *Colpito:* 2 (1d4) danni taglienti più 2 (1d4) danni da fuoco.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: destrezza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno: {numero_dadi: 1, dado: d4, tipo_danno: tagliente}
  - nome: "Soffio di vapore (ricarica 6)"
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 10, tutte le creature in un cono di 4,5 metri. *Fallimento:* 5 (2d4) danni da fuoco, e la velocità del bersaglio è ridotta di 3 metri fino al termine del turno successivo del mephit. *Successo:* danni dimezzati. *Fallimento o successo:* trovarsi sott'acqua non conferisce alcuna resistenza contro questi danni da fuoco.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: destrezza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 2, dado: d4, tipo_danno: fuoco}
        successo: danno-dimezzato
