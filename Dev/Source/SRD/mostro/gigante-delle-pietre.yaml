id: dnd.mostro.gigante-delle-pietre
nome: Gigante delle pietre
taglia: enorme
tipo: gigante
gruppo: Giganti
allineamento: neutrale
ca: {valore: 17}
caratteristiche:
  forza: {valore: 23, competenza: false}
  destrezza: {valore: 15, competenza: true}
  costituzione: {valore: 20, competenza: true}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 12, competenza: true}
  carisma: {valore: 9, competenza: false}
iniziativa: competenza
dadi_vita: 11
velocita: {camminata: 12}
abilita: [furtivita: competenza, percezione: competenza, atletica: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 14
lingue: [Gigante]
gs: 7

azioni:
  - nome: Multiattacco
    descrizione: |
      Il gigante effettua due attacchi, usando Randello di pietra o Macigno in qualsiasi combinazione.
  - nome: Randello di pietra
    descrizione: |
      *Tiro per colpire in mischia:* +9, portata 4,5 m. *Colpito:* 22 (3d10 + 6) danni contundenti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 4.5
        colpito:
          - danno:
              numero_dadi: 3
              dado: d10
              tipo_danno: contundente
              bonus: {caratteristica: forza}
  - nome: Macigno
    descrizione: |
      *Tiro per colpire a distanza:* +9, gittata 18/72 m. *Colpito:* 15 (2d8 + 6) danni contundenti. Se il bersaglio è una creatura di taglia Grande o inferiore, cade a terra prono.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          gittata: {normale: 18, lunga: 72}
        colpito:
          - danno:
              numero_dadi: 2
              dado: d8
              tipo_danno: contundente
              bonus: {caratteristica: forza}
reazioni:
  - nome: "Deviare proiettili (ricarica 5-6)"
    descrizione: |
      *Attivazione:* il gigante viene colpito da un tiro per colpire a distanza che gli infligge danni contundenti, perforanti o taglienti.

      *Esito:* il gigante riduce i danni subiti dall'attacco di 11 (1d10 + 6) e, se li riduce a 0, può deflettere una parte della forza di quell'attacco.

      *Tiro salvezza su Destrezza:* CD 17, una creatura che il gigante è in grado di vedere entro 18 metri.

      *Fallimento:* 11 (1d10 + 6) danni da forza.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: forza, base: 8, competenza: true}
