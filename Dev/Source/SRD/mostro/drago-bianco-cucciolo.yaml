id: dnd.mostro.drago-bianco-cucciolo
nome: Drago bianco cucciolo
taglia: media
tipo: drago
sottotipo: cromatico
gruppo: Draghi bianchi
allineamento: caotico malvagio
ca: {valore: 16}
caratteristiche:
  forza: {valore: 14, competenza: false}
  destrezza: {valore: 10, competenza: true}
  costituzione: {valore: 14, competenza: false}
  intelligenza: {valore: 5, competenza: false}
  saggezza: {valore: 10, competenza: true}
  carisma: {valore: 11, competenza: false}
iniziativa: competenza
dadi_vita: 5
velocita: {camminata: 5, nuoto: 9, volo: 18}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 18, vista_cieca: 3}
percezione_passiva: 14
immunita_danni: [freddo]
lingue: [Draconico]
gs: 2

tratti:
  - nome: Camminare sul ghiaccio
    descrizione: |
      Il drago può muoversi sulle superfici di ghiaccio e scalarle senza bisogno di effettuare una prova di caratteristica. Inoltre, un terreno difficile costituito da ghiaccio o neve non gli costa alcun movimento aggiuntivo.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 2}
    descrizione: |
      Il drago effettua due attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +4, portata 1,5 m. *Colpito:* 6 (1d8 + 2) danni taglienti più 2 (1d4) danni da freddo.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di freddo (ricarica 5-6)"
    id: soffio-di-freddo-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 12, tutte le creature in un cono di 4,5 metri. *Fallimento:* 22 (5d8) danni da freddo. *Successo:* danni dimezzati.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: forza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 5, dado: d8, tipo_danno: freddo}
        successo: danno-dimezzato
