id: dnd.mostro.drago-nero-giovane
nome: Drago nero giovane
taglia: grande
tipo: drago
sottotipo: cromatico
gruppo: Draghi neri
allineamento: caotico malvagio
ca: {valore: 18}
caratteristiche:
  forza: {valore: 19, competenza: false}
  destrezza: {valore: 14, competenza: true}
  costituzione: {valore: 17, competenza: false}
  intelligenza: {valore: 12, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 15, competenza: false}
iniziativa: competenza
dadi_vita: 15
velocita: {camminata: 12, nuoto: 12, volo: 24}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 36, vista_cieca: 9}
percezione_passiva: 16
immunita_danni: [acido]
lingue: [Comune, Draconico]
gs: 7

tratti:
  - nome: Anfibio
    descrizione: |
      Il drago può respirare in aria e in acqua.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 3}
    descrizione: |
      Il drago effettua tre attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +7, portata 3 m. *Colpito:* 9 (2d4 + 4) danni taglienti più 3 (1d6) danni da acido.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d4
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: "Soffio di acido (ricarica 5-6)"
    id: soffio-di-acido-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 14, tutte le creature in una linea lunga 9 metri e larga 1,5 metri. *Fallimento:* 49 (14d6) danni da acido. *Successo:* danni dimezzati.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 14, dado: d6, tipo_danno: acido}
        successo: danno-dimezzato
