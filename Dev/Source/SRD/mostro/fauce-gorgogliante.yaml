id: dnd.mostro.fauce-gorgogliante
nome: Fauce gorgogliante
taglia: media
tipo: aberrazione
allineamento: caotico neutrale
ca: {valore: 9}
caratteristiche:
  forza: {valore: 10, competenza: false}
  destrezza: {valore: 8, competenza: false}
  costituzione: {valore: 16, competenza: false}
  intelligenza: {valore: 3, competenza: false}
  saggezza: {valore: 10, competenza: false}
  carisma: {valore: 6, competenza: false}
dadi_vita: 7
velocita: {camminata: 6, nuoto: 6}
sensi: {scurovisione: 18}
percezione_passiva: 10
immunita_condizioni: [prono]
lingue: [nessuna]
gs: 2

tratti:
  - nome: Gorgogliare
    descrizione: |
      La fauce gorgoglia in modo incoerente fintanto che non è incapacitata.

      *Tiro salvezza su Saggezza:* CD 10, ogni creatura che inizi il suo turno entro 6 metri dalla fauce finché questa gorgoglia.

      *Fallimento:* il bersaglio tira 1d8 per determinare cosa fare nel turno corrente:
      - 1-4. Il bersaglio non fa nulla.
      - 5-6. Il bersaglio non effettua alcuna azione, né azione bonus, e usa tutto il suo movimento per muoversi in una direzione casuale.
      - 7-8. Il bersaglio effettua un attacco in mischia contro una creatura determinata casualmente entro la sua portata, oppure non fa nulla se non riesce a eseguire tale attacco.
  - nome: Terreno aberrante
    descrizione: |
      Il terreno in un'emanazione di 3 metri di cui la fauce gorgogliante è il punto di origine è considerato terreno difficile.
azioni:
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +2, portata 1,5 m. *Colpito:* 7 (2d6) danni perforanti. Se il bersaglio è una creatura di taglia Media o inferiore, cade a terra prono. Il bersaglio muore se viene ridotto a 0 punti ferita da questo attacco. Del suo corpo, che viene assorbito dalla fauce gorgogliante, resta solo l'equipaggiamento.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno: {numero_dadi: 2, dado: d6, tipo_danno: perforante}
  - nome: "Sputo accecante (ricarica 5-6)"
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 10, tutte le creature in una sfera di 3 metri di raggio centrata su un punto entro 9 metri.

      *Fallimento:* 7 (2d6) danni radiosi, e il bersaglio è accecato fino al termine del turno successivo della fauce gorgogliante.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: forza, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 2, dado: d6, tipo_danno: radioso}
