id: dnd.mostro.orso-bruno
nome: Orso bruno
taglia: grande
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 11}
caratteristiche:
  forza: {valore: 17, competenza: false}
  destrezza: {valore: 12, competenza: false}
  costituzione: {valore: 15, competenza: false}
  intelligenza: {valore: 2, competenza: false}
  saggezza: {valore: 13, competenza: false}
  carisma: {valore: 7, competenza: false}
dadi_vita: 3
velocita: {camminata: 12, scalata: 9}
abilita: [percezione: competenza]
sensi: {scurovisione: 18}
percezione_passiva: 13
lingue: [nessuna]
gs: 1

azioni:
  - nome: Multiattacco
    descrizione: |
      L'orso effettua un attacco Morso e un attacco Artiglio.
  - nome: Artiglio
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m. *Colpito:* 5 (1d4 + 3) danni taglienti. Se il bersaglio è una creatura di taglia Grande o inferiore, cade a terra prono.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d4
              tipo_danno: tagliente
              bonus: {caratteristica: forza}
  - nome: Morso
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 1,5 m. *Colpito:* 7 (1d8 + 3) danni perforanti.

    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d8
              tipo_danno: perforante
              bonus: {caratteristica: forza}
