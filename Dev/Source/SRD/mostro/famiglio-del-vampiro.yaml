id: dnd.mostro.famiglio-del-vampiro
nome: Famiglio del vampiro
taglia: [media, piccola]
tipo: umanoide
gruppo: Vampiri
allineamento: neutrale malvagio
ca: {valore: 15}
caratteristiche:
  forza: {valore: 17, competenza: false}
  destrezza: {valore: 16, competenza: true}
  costituzione: {valore: 15, competenza: false}
  intelligenza: {valore: 10, competenza: false}
  saggezza: {valore: 10, competenza: true}
  carisma: {valore: 14, competenza: false}
iniziativa: competenza
dadi_vita: 10
velocita: {camminata: 9, scalata: 9}
abilita: [persuasione: competenza, furtivita: maestria, percezione: maestria]
sensi: {scurovisione: 18}
percezione_passiva: 14
resistenze: [necrotico]
immunita_condizioni: [affascinato]  # tranne che dal suo padrone vampiro
equipaggiamento:
  - {articolo: dnd.arma.pugnale, quantita: 10}
lingue: [Comune più un'altra lingua]
gs: 3

tratti:
  - nome: Connessione vampirica
    descrizione: |
      Finché il famiglio e il suo padrone vampiro si trovano sullo stesso piano di esistenza, il vampiro può comunicare con il famiglio telepaticamente ed è in grado di percepire attraverso i sensi del famiglio.
azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: pugnale-ombroso, ripetizioni: 2}
    descrizione: |
      Il famiglio effettua due attacchi Pugnale ombroso.
  - nome: Pugnale ombroso
    id: pugnale-ombroso
    descrizione: |
      *Tiro per colpire in mischia o a distanza:* +5, portata 1,5 m o gittata 6/18 m *Colpito:* 5 (1d4 + 3) danni perforanti più 7 (3d4) danni necrotici. Se il bersaglio viene ridotto a 0 punti ferita da questo attacco, diventa stabile ma è avvelenato per 1 ora. Finché è avvelenato, il bersaglio è anche paralizzato.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          gittata: {normale: 6, lunga: 18}
        colpito:
          - danno:
              numero_dadi: 1
              dado: d4
              tipo_danno: perforante
              bonus: {caratteristica: forza}
azioni_bonus:
  - nome: Agilità immortale
    descrizione: |
      Il famiglio effettua l'azione di Disimpegno o Scatto.
