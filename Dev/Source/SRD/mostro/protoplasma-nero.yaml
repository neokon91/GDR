id: dnd.mostro.protoplasma-nero
nome: Protoplasma nero
taglia: grande
tipo: melma
allineamento: senza allineamento
ca: {valore: 7}
caratteristiche:
  forza: {valore: 16, competenza: false}
  destrezza: {valore: 5, competenza: false}
  costituzione: {valore: 16, competenza: false}
  intelligenza: {valore: 1, competenza: false}
  saggezza: {valore: 6, competenza: false}
  carisma: {valore: 1, competenza: false}
dadi_vita: 8
velocita: {camminata: 6, scalata: 6}
sensi: {vista_cieca: 18}
percezione_passiva: 8
immunita_danni: [acido, freddo, fulmine, tagliente]
immunita_condizioni: [affascinato, afferrato, assordato, indebolimento, prono, spaventato, trattenuto]
lingue: [nessuna]
gs: 4

tratti:
  - nome: Amorfo
    descrizione: |
      Il protoplasma può muoversi attraverso uno spazio stretto fino a 2,5 centimetri senza consumare movimento extra per farlo.
  - nome: Forma corrosiva
    descrizione: |
      Una creatura che colpisce un protoplasma con un tiro per colpire in mischia subisce 4 (1d8) danni da acido. Le munizioni non magiche che colpiscono il protoplasma e infliggono danni sono distrutte. Qualsiasi arma non magica subisce una penalità cumulativa di -1 ai tiri per colpire subito dopo aver inflitto danni al protoplasma ed esservi entrata in contatto. Se la penalità arriva a -5, l'arma è distrutta. La penalità può essere rimossa lanciando l'incantesimo riparare sull'arma. In 1 minuto, il protoplasma può corrodere 60 centimetri di legno o metallo non magico.
  - nome: Movimenti del ragno
    descrizione: |
      Il protoplasma può scalare le superfici difficili, compresi i soffitti, senza effettuare una prova di caratteristica.
azioni:
  - nome: Pseudopode dissolvente
    descrizione: |
      *Tiro per colpire in mischia:* +5, portata 3 m. *Colpito:* 17 (4d6 + 3) danni da acido. L'armatura non magica indossata dal bersaglio subisce una penalità di -1 alla CA che fornisce. Se la penalità riduce la sua CA a 10, l'armatura si distrugge. La penalità può essere rimossa lanciando l'incantesimo riparare sull'armatura.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 4
              dado: d6
              tipo_danno: acido
              bonus: {caratteristica: forza}
reazioni:
  - nome: Scindersi
    descrizione: |
      Attivazione: finché il protoplasma è di taglia Grande o Media e ha 10 punti ferita o più, diventa sanguinante o è soggetto a danni da fulmine o taglienti. Esito: il protoplasma si scinde in due nuovi protoplasmi neri. Ogni nuovo protoplasma è inferiore di una taglia rispetto al protoplasma originale, e agisce di propria iniziativa. I punti ferita del protoplasma originale sono divisi equamente tra i due nuovi protoplasmi (arrotondati per difetto).
