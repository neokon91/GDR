id: dnd.mostro.mammut
nome: Mammut
taglia: enorme
tipo: bestia
gruppo: Animali
allineamento: senza allineamento
ca: {valore: 13}
caratteristiche:
  forza: {valore: 24, competenza: true}
  destrezza: {valore: 9, competenza: false}
  costituzione: {valore: 21, competenza: true}
  intelligenza: {valore: 3, competenza: false}
  saggezza: {valore: 11, competenza: false}
  carisma: {valore: 6, competenza: false}
iniziativa: competenza
dadi_vita: 11
velocita: {camminata: 15}
percezione_passiva: 10
lingue: [nessuna]
gs: 6

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: trafiggere, ripetizioni: 2}
    descrizione: |
      Il mammut effettua due attacchi Trafiggere.
  - nome: Trafiggere
    id: trafiggere
    descrizione: |
      *Tiro per colpire in mischia:* +10, portata 3 m. *Colpito:* 18 (2d10 + 7) danni perforanti. Se il bersaglio è una creatura di taglia Enorme o inferiore e il mammut si è mosso di 6 metri o più in linea retta verso di esso subito prima del colpo, il bersaglio cade a terra prono.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 3
        colpito:
          - danno:
              numero_dadi: 2
              dado: d10
              tipo_danno: perforante
              bonus: {caratteristica: forza}
azioni_bonus:
  - nome: Calpestare
    descrizione: |
      *Tiro salvezza su Destrezza:* CD 18, una creatura prona entro 1,5 metri. *Fallimento:* 29 (4d10 + 7) danni contundenti. *Successo:* danni dimezzati.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: destrezza
          cd: {caratteristica: forza, base: 8, competenza: true}
        successo: danno-dimezzato
