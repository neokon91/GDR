id: dnd.mostro.drago-d-argento-cucciolo
nome: Drago d'argento cucciolo
taglia: media
tipo: drago
sottotipo: metallico
gruppo: Draghi d'argento
allineamento: legale buono
ca: {valore: 17}
caratteristiche:
  forza: {valore: 19, competenza: false}
  destrezza: {valore: 10, competenza: true}
  costituzione: {valore: 17, competenza: false}
  intelligenza: {valore: 12, competenza: false}
  saggezza: {valore: 11, competenza: true}
  carisma: {valore: 15, competenza: false}
iniziativa: competenza
dadi_vita: 6
velocita: {camminata: 9, volo: 18}
abilita: [furtivita: competenza, percezione: maestria]
sensi: {scurovisione: 18, vista_cieca: 3}
percezione_passiva: 14
immunita_danni: [freddo]
lingue: [Draconico]
gs: 2

azioni:
  - nome: Multiattacco
    id: multiattacco
    attivita:
      - tipo: multiattacco
        sequenza:
          - {azione: squarcio, ripetizioni: 2}
    descrizione: |
      Il drago effettua due attacchi Squarcio.
  - nome: Squarcio
    id: squarcio
    descrizione: |
      *Tiro per colpire in mischia:* +6, portata 1,5 m. *Colpito:* 9 (1d10 + 4) danni perforanti.
    attivita:
      - tipo: attacco
        attacco:
          categoria: attacco-naturale
          bonus: {caratteristica: forza, competenza: true}
          bersagli: 1
          portata: 1.5
        colpito:
          - danno:
              numero_dadi: 1
              dado: d10
              tipo_danno: perforante
              bonus: {caratteristica: forza}
  - nome: "Soffio di freddo (ricarica 5-6)"
    id: soffio-di-freddo-ricarica-5-6
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 13, tutte le creature in un cono di 4,5 metri. *Fallimento:* 18 (4d8) danni da freddo. *Successo:* danni dimezzati.
    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
        fallimento:
          - danno: {numero_dadi: 4, dado: d8, tipo_danno: freddo}
        successo: danno-dimezzato
  - nome: Soffio paralizzante
    id: soffio-paralizzante
    descrizione: |
      *Tiro salvezza su Costituzione:* CD 13, tutte le creature in un cono di 4,5 metri. *Primo fallimento:* il bersaglio è incapacitato fino al termine del proprio turno successivo. A quel punto, ripete il tiro salvezza. *Secondo fallimento:* il bersaglio è paralizzato e ripete il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Dopo 1 minuto, il tiro viene superato automaticamente.

    attivita:
      - tipo: tiro-salvezza
        tiro_salvezza:
          caratteristica: costituzione
          cd: {caratteristica: costituzione, base: 8, competenza: true}
