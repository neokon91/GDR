id: dnd.oggetto-magico.bacchetta-di-individuazione-del-magico
nome: Bacchetta di individuazione del magico
categoria: bacchetta
rarita: non-comune
richiede_sintonia: false
cariche: {massimo: 3, ricarica: "1d3"}
attivita:
  - tipo: incantatore
    cariche:
      - {incantesimo: dnd.incantesimo.individuazione-del-magico, costo: 1}
descrizione: |
  Questa bacchetta ha 3 cariche. Mentre il personag-gio la impugna, può consumare 1 carica e usarla per lanciare individuazione del magico. All'alba di ogni giorno, la bacchetta recupera 1d3 cariche consumate.
