id: dnd.oggetto-magico.fermaglio-dello-scudo
nome: Fermaglio dello scudo
categoria: oggetto-meraviglioso
rarita: non-comune
richiede_sintonia: true
attivita:
  - tipo: passivo
    effetti:
      - {bersaglio: resistenze, operazione: concedi, valore: [forza]}
descrizione: |
  Quando indossa questo fermaglio, il personaggio ottiene resistenza ai danni da forza ed è immune ai danni inflitti dall'incantesimo dardo incantato.
