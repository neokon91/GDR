id: dnd.oggetto-magico.amuleto-della-salute
nome: Amuleto della salute
categoria: oggetto-meraviglioso
rarita: rara
richiede_sintonia: true
attivita:
  - tipo: passivo
    effetti:
      - {bersaglio: caratteristiche.costituzione.valore, operazione: aumento, valore: 19}
descrizione: |
  Il punteggio di Costituzione del possessore di que-sto amuleto è pari a 19 mentre lo indossa. Se il suo punteggio di Costituzione è già pari o superiore a 19, l'amuleto non ha alcun effetto.
