id: dnd.oggetto-magico.anello-di-resistenza
nome: Anello di resistenza
categoria: anello
rarita: rara
richiede_sintonia: false
versioni:
  - nome: "Acido (perla)"
    valore: acido
  - nome: "Forza (zaffiro)"
    valore: forza
  - nome: "Freddo (tormalina)"
    valore: freddo
  - nome: "Fulmine (citrino)"
    valore: fulmine
  - nome: "Fuoco (granato)"
    valore: fuoco
  - nome: "Necrotico (giaietto)"
    valore: necrotico
  - nome: "Psichico (giada)"
    valore: psichico
  - nome: "Radioso (topazio)"
    valore: radioso
  - nome: "Tuono (spinello)"
    valore: tuono
  - nome: "Veleno (ametista)"
    valore: veleno
attivita:
  - tipo: passivo
    effetti:
      - {bersaglio: resistenze, operazione: concedi, valore: versione}
descrizione: |
  Finché il personaggio indossa questo anello, ottiene resistenza a un tipo di danno rappresentato dalla gemma incastonata in esso. Questa è a scelta del GM o determinata casualmente tirando sulla tabella seguente.

  ### 1d10 Tipo di danno Gemma
  **1** Acido Perla
  **2** Forza Zaffiro
  **3** Freddo Tormalina
  **4** Fulmine Citrino
  **5** Fuoco Granato
  **6** Necrotico Giaietto
  **7** Psichico Giada
  **8** Radioso Topazio
  **9** Tuono Spinello
  **10** Veleno Ametista
