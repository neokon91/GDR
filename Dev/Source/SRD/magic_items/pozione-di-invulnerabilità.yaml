id: dnd.oggetto-magico.pozione-di-invulnerabilità
nome: Pozione di invulnerabilità
categoria: pozione
rarita: rara
richiede_sintonia: false
consumabile: true
attivita:
  - tipo: attivabile
    durata: {valore: 1, unita: minuti}
    effetti:
      - {bersaglio: resistenze, operazione: concedi, valore: [perforante, tagliente, contundente, fuoco, veleno, freddo, acido, fulmine, psichico, forza, necrotico, tuono, radioso]}
descrizione: |
  Dopo aver bevuto questa pozione, il personaggio ottiene resistenza a tutti i danni per 1 minuto.Il liquido pastoso della pozione sembra ferro fuso.
