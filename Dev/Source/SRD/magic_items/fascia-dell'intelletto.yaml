id: dnd.oggetto-magico.fascia-dell'intelletto
nome: Fascia dell'intelletto
categoria: oggetto-meraviglioso
rarita: non-comune
richiede_sintonia: true
attivita:
  - tipo: passivo
    effetti:
      - {bersaglio: caratteristiche.intelligenza.valore, operazione: aumento, valore: 19}
descrizione: |
  Finché il personaggio indossa questa fascia, il suo punteggio di Intelligenza è pari a 19. Se il suo punteggio di Intelligenza è già pari o superiore a 19, l'oggetto non ha alcun effetto.
