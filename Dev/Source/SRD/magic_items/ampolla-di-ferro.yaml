id: dnd.oggetto-magico.ampolla-di-ferro
nome: Ampolla di ferro
categoria: oggetto-meraviglioso
rarita: leggendaria
richiede_sintonia: false
descrizione: |
  Mentre il personaggio tiene in mano questa ampolla di ferro chiusa da un tappo di ottone, può effettuare un'azione di Magia per prendere di mira una creatura che è in grado di vedere entro  18 metri da sé. Se l'ampolla è vuota e il bersaglio  è originario di un piano di esistenza diverso da quello in cui si trova ora, deve superare un tiro salvezza su Saggezza con CD 17, altrimenti viene intrappolato all'interno dell'ampolla. Se il bersaglio è già stato intrappolato in questo modo in passato, effettua il tiro salvezza con vantaggio. Una volta  intrappolata, la creatura rimane nell'ampolla finché 
  non viene liberata. L 'ampolla può contenere una  sola creatura alla volta. Una creatura intrappolata nell'ampolla non invecchia e non ha bisogno di respirare, mangiare o bere.
  Il personaggio può effettuare un'azione di Magia per rimuovere il tappo e liberare la creatura intrap-polata. Questa obbedirà ai suoi comandi per 1 ora e li capirà nonostante non conosca la lingua in cui vengono impartiti. Se non riceve alcun comando o ne riceve uno che potrebbe portarla alla morte o alla prigionia, si limita a difendersi senza eseguire  alcuna azione. Alla fine dell'ora, la creatura torna  a comportarsi come previsto dalla sua natura e dal suo allineamento.
  Un incantesimo identificare rivela se l'ampolla contiene o meno una creatura, ma l'unico modo per determinarne la tipologia è aprirla. Quando viene trovata, l'ampolla di ferro può contenere già una creatura scelta dal GM.
