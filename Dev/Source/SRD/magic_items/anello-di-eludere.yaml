id: dnd.oggetto-magico.anello-di-eludere
nome: Anello di eludere
categoria: anello
rarita: rara
richiede_sintonia: true
cariche: {massimo: 3, ricarica: "1d3"}
attivita:
  - tipo: reazione-automatica
    innesco: {evento: fallisce-tiro-salvezza, caratteristica: destrezza}
    effetto: {sostituisci_esito: successo}
    costo: 1
descrizione: |
  Questo anello ha 3 cariche e recupera 1d3 cariche consumate all'alba di ogni giorno. Se il personaggio fallisce un tiro salvezza su Destrezza mentre indossa l'anello, può usare la sua reazione per  consumare 1 carica e superare quel tiro salvezza.
