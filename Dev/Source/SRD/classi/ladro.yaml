id: dnd.classe.ladro
nome: Ladro
caratteristica_primaria: [destrezza]
dado_vita: 8
tiri_salvezza: [destrezza, intelligenza]
competenze_abilita:
  quantita: 4
  scelte: [acrobazia, atletica, furtivita, indagare, inganno, intimidire, intuizione, percezione, persuasione, rapidita-di-mano]
competenze_armi: [armi-semplici, {categoria: armi-da-guerra, proprieta: [accurata, leggera]}]
competenze_armature: [armature-leggere]
competenze_strumenti: {quantita: 1, scelte: [dnd.strumento.attrezzi-da-scasso]}
# Preso come classe secondaria (multiclasse): armatura leggera, attrezzi da
# scasso e una abilità a scelta dalla lista del ladro.
competenze_multiclasse:
  armature: [armature-leggere]
  strumenti: [dnd.strumento.attrezzi-da-scasso]
  abilita: {quantita: 1, scelte: [acrobazia, atletica, furtivita, indagare, inganno, intimidire, intuizione, percezione, persuasione, rapidita-di-mano]}
equipaggiamento_iniziale:
  - nome: A
    oggetti:
      - articolo: dnd.armatura.armatura-di-cuoio
      - articolo: dnd.arma.pugnale
        quantita: 2
      - articolo: dnd.arma.spada-corta
      - articolo: dnd.arma.arco-corto
      - articolo: frecce
        quantita: 20
      - articolo: dnd.oggetto.faretra
      - articolo: dnd.strumento.attrezzi-da-scasso
      - articolo: dnd.oggetto.dotazione-da-scassinatore
      - articolo: dnd.valuta.moneta-oro
        quantita: 8
  - nome: B
    oggetti:
      - articolo: dnd.valuta.moneta-oro
        quantita: 100
descrizione: |
  Il ladro e un esperto di precisione, furtivita e competenze, basato soprattutto su Destrezza. La sottoclasse SRD è il Furfante.
tabella_progressione:
