id: dnd.classe.ranger
nome: Ranger
caratteristica_primaria: [destrezza, saggezza]
dado_vita: 10
tiri_salvezza: [forza, destrezza]
competenze_abilita:
  quantita: 3
  scelte: [addestrare-animali, atletica, furtivita, indagare, intuizione, natura, percezione, sopravvivenza]
competenze_armi: [armi-semplici, armi-da-guerra]
competenze_armature: [armature-leggere, armature-medie, scudi]
# Preso come classe secondaria (multiclasse): sottoinsieme delle competenze
# (+ una abilità a scelta dalla lista del ranger).
competenze_multiclasse:
  armi: [armi-semplici, armi-da-guerra]
  armature: [armature-leggere, armature-medie, scudi]
  abilita: {quantita: 1, scelte: [addestrare-animali, atletica, furtivita, indagare, intuizione, natura, percezione, sopravvivenza]}
equipaggiamento_iniziale:
  - nome: A
    oggetti:
      - articolo: dnd.armatura.armatura-di-cuoio-borchiato
      - articolo: dnd.arma.scimitarra
      - articolo: dnd.arma.spada-corta
      - articolo: dnd.arma.arco-lungo
      - articolo: frecce
        quantita: 20
      - articolo: dnd.oggetto.faretra
      - articolo: dnd.oggetto.focus-druidico
      - articolo: dnd.oggetto.dotazione-da-esploratore
      - articolo: dnd.valuta.moneta-oro
        quantita: 7
  - nome: B
    oggetti:
      - articolo: dnd.valuta.moneta-oro
        quantita: 150
descrizione: |
  Il ranger è un esploratore marziale e primordiale basato su Destrezza e Saggezza, magia naturale e mobilita. La sottoclasse SRD è il Cacciatore.
tabella_progressione:
  benefici:
  - livello: 1
    privilegi: [nemico-prescelto, lancio-incantesimi, maestria-armi]
    nemico_prescelto: 2
    incantesimi_preparati: 2
    slot_incantesimo: {livello1: 2, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 2
    privilegi: [esploratore-esperto, stile-combattimento]
    nemico_prescelto: 2
    incantesimi_preparati: 3
    slot_incantesimo: {livello1: 2, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 3
    privilegi: [sottoclasse-del-ranger]
    nemico_prescelto: 2
    incantesimi_preparati: 4
    slot_incantesimo: {livello1: 3, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 4
    privilegi: [aumento-punteggi-caratteristica]
    nemico_prescelto: 2
    incantesimi_preparati: 5
    slot_incantesimo: {livello1: 3, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 5
    privilegi: [attacco-extra]
    nemico_prescelto: 3
    incantesimi_preparati: 6
    slot_incantesimo: {livello1: 4, livello2: 2, livello3: 0, livello4: 0, livello5: 0}
  - livello: 6
    privilegi: [girovago]
    nemico_prescelto: 3
    incantesimi_preparati: 6
    slot_incantesimo: {livello1: 4, livello2: 2, livello3: 0, livello4: 0, livello5: 0}
  - livello: 7
    privilegi: [privilegio-della-sottoclasse]
    nemico_prescelto: 3
    incantesimi_preparati: 7
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 0, livello4: 0, livello5: 0}
  - livello: 8
    privilegi: [aumento-punteggi-caratteristica]
    nemico_prescelto: 3
    incantesimi_preparati: 7
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 0, livello4: 0, livello5: 0}
  - livello: 9
    privilegi: [maestria]
    nemico_prescelto: 4
    incantesimi_preparati: 9
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 2, livello4: 0, livello5: 0}
  - livello: 10
    privilegi: [instancabile]
    nemico_prescelto: 4
    incantesimi_preparati: 9
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 2, livello4: 0, livello5: 0}
  - livello: 11
    privilegi: [privilegio-della-sottoclasse]
    nemico_prescelto: 4
    incantesimi_preparati: 10
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 3, livello4: 0, livello5: 0}
  - livello: 12
    privilegi: [aumento-punteggi-caratteristica]
    nemico_prescelto: 4
    incantesimi_preparati: 10
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 3, livello4: 0, livello5: 0}
  - livello: 13
