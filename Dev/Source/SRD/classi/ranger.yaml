    nemico_prescelto: 6
    incantesimi_preparati: 14
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 3, livello4: 3, livello5: 1}
  - livello: 18
    privilegi: [sensi-ferini]
    nemico_prescelto: 6
