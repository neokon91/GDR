privilegi:
- id: ispirazione-bardica
  nome: "Ispirazione Bardica"
  descrizione: |
    Puoi ispirare soprannaturalmente gli altri tramite parole, musica o danza. Questa ispirazione è rappresentata dal tuo dado di Ispirazione Bardica, che è un d6.

    **Usare l'Ispirazione Bardica.** Come Azione Bonus, puoi ispirare un'altra creatura entro 18 metri da te che sia in grado di vederti o sentirti.
    Quella creatura ottiene uno dei tuoi dadi di Ispirazione Bardica.
    Una creatura può possedere un solo dado di Ispirazione Bardica alla volta.

    Entro la successiva ora, quando la creatura fallisce una Prova su d20, può tirare il dado di Ispirazione Bardica e aggiungere il risultato ottenuto al d20, trasformando potenzialmente il fallimento in un successo.
    Il dado di Ispirazione Bardica viene consumato una volta tirato.

    **Numero di utilizzi.** Puoi conferire un dado di Ispirazione Bardica un numero di volte pari al tuo modificatore di Carisma (minimo una volta) e recuperi tutti gli utilizzi consumati al termine di un Riposo Lungo.

    **Ai livelli superiori.** Il tuo dado di Ispirazione Bardica cambia quando raggiungi determinati livelli da Bardo, come indicato nella colonna "Dado Bardico" della tabella delle Capacità del Bardo.
    Il dado diventa un d8 al livello 5, un d10 al livello 10 e un d12 al livello 15.
  attivita:
    # Il contenitore (Azione Bonus, usi = mod Carisma). Il dado dato a un'altra
    # creatura e il suo effetto sulla prova restano PROSA (buff su un altro attore).
    - {tipo: attivabile, azione: azione-bonus, usi: {da_caratteristica: carisma, minimo: 1, ricarica: {riposo-lungo: tutti}}}
- id: lancio-incantesimi
  nome: "Lancio di Incantesimi"
  attivita:
    - tipo: incantatore
      caratteristica: carisma
  descrizione: |
    Hai imparato a lanciare incantesimi attraverso le tue arti bardiche.

    **Trucchetti.** Conosci due trucchetti a tua scelta dalla lista degli incantesimi del bardo.

    Ogni volta che ottieni un livello da bardo, puoi sostituire uno dei tuoi trucchetti con un altro trucchetto a tua scelta dalla lista degli incantesimi del bardo.

    Quando raggiungi il 4° e il 10° livello da bardo, impari un altro trucchetto a tua scelta dalla lista degli incantesimi del bardo, come indicato nella colonna Trucchetti della tabella Capacità del Bardo.

    **Slot Incantesimo.** La tabella Capacità del Bardo indica quanti slot incantesimo possiedi per lanciare i tuoi incantesimi di 1° livello o superiore. Recuperi tutti gli slot consumati al termine di un Riposo Lungo.

    **Incantesimi Preparati di 1° Livello o Superiore.** Prepari l'elenco degli incantesimi di 1° livello o superiore che puoi lanciare grazie a questa capacità. Per iniziare, scegli quattro incantesimi di 1° livello dalla lista degli incantesimi del bardo.

    Il numero di incantesimi nel tuo elenco aumenta man mano che ottieni livelli da bardo, come indicato nella colonna Incantesimi Preparati della tabella Capacità del Bardo. Ogni volta che tale numero aumenta, scegli ulteriori incantesimi dalla lista degli incantesimi del bardo finché il numero di incantesimi nel tuo elenco non corrisponde a quello indicato nella tabella. Gli incantesimi scelti devono essere di un livello per il quale disponi di slot incantesimo. Per esempio, se sei un bardo di 3° livello, il tuo elenco di incantesimi preparati può includere sei incantesimi di 1° e 2° livello in qualsiasi combinazione.

    Se un'altra capacità da bardo ti conferisce incantesimi che hai sempre preparati, tali incantesimi non contano ai fini del numero di incantesimi che puoi preparare con questa capacità, ma per te contano comunque come incantesimi da bardo.

    **Cambiare gli Incantesimi Preparati.** Ogni volta che ottieni un livello da bardo, puoi sostituire un incantesimo del tuo elenco con un altro incantesimo da bardo per il quale disponi di slot incantesimo.

    **Caratteristica da Incantatore.** Il Carisma è la tua caratteristica da incantatore per i tuoi incantesimi da bardo.

    **Focus di Incantesimo.** Puoi utilizzare uno strumento musicale come focus di incantesimo per i tuoi incantesimi da bardo.
- id: maestria
  nome: "Maestria"
  descrizione: |
    Ottieni Maestri in due delle tue competenze nelle abilità a tua scelta.

    Al livello 9 da Bardo, ottieni Competenza Specialistica in altre due delle tue competenze nelle abilità a tua scelta.
  attivita:
    - {tipo: scelta, scelta: maestria-abilita, quantita: 2}
- id: tuttofare
  nome: "Tuttofare"
  descrizione: |
    Puoi aggiungere metà del tuo Bonus di Competenza (arrotondato per difetto) a qualsiasi prova di caratteristica che utilizzi una competenza nelle abilità che non possiedi e che non utilizzi già il tuo Bonus di Competenza.

    Per esempio, se effettui una prova di Forza (Atletica) e non possiedi la competenza in Atletica, puoi aggiungere metà del tuo Bonus di Competenza alla prova.
- id: sottoclasse-del-bardo
  nome: "Sottoclasse del Bardo"
  descrizione: |
    Ottieni una sottoclasse da Bardo a tua scelta. Una sottoclasse è una specializzazione che ti conferisce capacità a determinati livelli da Bardo. Per il resto della tua carriera, ottieni tutte le capacità della tua sottoclasse corrispondenti al tuo livello da Bardo o a livelli inferiori.
- id: aumento-punteggi-caratteristica
  nome: "Aumento del Punteggio di Caratteristica"
  descrizione: |
    Ottieni il talento Incremento del Punteggio di Caratteristica o un altro talento a tua scelta per il quale soddisfi i prerequisiti. Ottieni nuovamente questa capacità ai livelli 8, 12 e 16 da Bardo.
- id: fonte-di-ispirazione
  nome: "Fonte di Ispirazione"
  descrizione: |
    Ora recuperi tutti gli utilizzi consumati di Ispirazione Bardica quando termini un Riposo Breve o Lungo.

    Inoltre, puoi consumare uno slot incantesimo (senza richiedere alcuna azione) per recuperare un utilizzo consumato di Ispirazione Bardica.
- id: controfascino
  nome: "Controfascino"
  descrizione: |
    Puoi usare note musicali o parole di potere per contrastare effetti che influenzano la mente. Se tu o una creatura entro 9 metri (30 piedi) da te fallite un tiro salvezza contro un effetto che impone la condizione Affascinato o Spaventato, puoi usare una Reazione per far ritirare il tiro salvezza; il nuovo tiro beneficia di Vantaggio.
- id: segreti-magici
  nome: "Segreti Magici"
  descrizione: |
    Hai appreso segreti da varie tradizioni magiche. Ogni volta che raggiungi un livello da Bardo (incluso questo livello) e il numero di incantesimi preparati indicato nella tabella delle caratteristiche del Bardo aumenta, puoi scegliere i tuoi nuovi incantesimi preparati dalle liste degli incantesimi di Bardo, Chierico, Druido e Mago; gli incantesimi scelti contano come incantesimi da Bardo per te. Inoltre, ogni volta che sostituisci un incantesimo preparato per questa classe, puoi sostituirlo con un incantesimo proveniente da quelle liste.
- id: ispirazione-superiore
  nome: "Ispirazione Superiore"
  descrizione: |
    Quando tiri per l'iniziativa, recuperi utilizzi consumati di Ispirazione Bardica fino ad averne due, se ne possiedi meno.
- id: dono-epico
  nome: "Dono Epico"
  descrizione: |
    Ottieni un talento Dono Epico o un altro talento a tua scelta per il quale soddisfi i prerequisiti.
- id: parole-della-creazione
  nome: "Parole della Creazione"
  descrizione: |
    Hai padroneggiato due delle Parole della Creazione: le parole della vita e della morte. Di conseguenza, hai sempre preparati gli incantesimi *Parola del Potere: Guarigione* e *Parola del Potere: Uccidere*. Quando lanci uno di questi incantesimi, puoi bersagliare anche una seconda creatura, a condizione che essa si trovi entro 3 metri (10 piedi) dal primo bersaglio.
