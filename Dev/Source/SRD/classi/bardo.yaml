      - articolo: dnd.oggetto.dotazione-da-intrattenitore
      - articolo: dnd.valuta.moneta-oro
        quantita: 19
  - nome: B
    oggetti:
      - articolo: dnd.valuta.moneta-oro
        quantita: 90
descrizione: |
  Il bardo è un incantatore carismatico che sostiene il gruppo con Ispirazione bardica, competenze ampie e magia.
  La sottoclasse SRD è il Collegio della Sapienza.
