id: dnd.classe.paladino
nome: Paladino
caratteristica_primaria: [forza, carisma]
dado_vita: 10
tiri_salvezza: [saggezza, carisma]
competenze_abilita:
  quantita: 2
  scelte: [atletica, intimidire, intuizione, medicina, persuasione, religione]
competenze_armi: [armi-semplici, armi-da-guerra]
competenze_armature: [armature-leggere, armature-medie, armature-pesanti, scudi]
# Preso come classe secondaria (multiclasse): sottoinsieme delle competenze.
competenze_multiclasse:
  armi: [armi-semplici, armi-da-guerra]
  armature: [armature-leggere, armature-medie, scudi]
equipaggiamento_iniziale:
  - nome: A
    oggetti:
      - articolo: dnd.armatura.cotta-di-maglia
      - articolo: dnd.armatura.scudo
      - articolo: dnd.arma.spada-lunga
      - articolo: dnd.arma.giavellotto
        quantita: 6
      - articolo: dnd.oggetto.simbolo-sacro
      - articolo: dnd.oggetto.dotazione-da-sacerdote
      - articolo: dnd.valuta.moneta-oro
        quantita: 9
  - nome: B
    oggetti:
      - articolo: dnd.valuta.moneta-oro
        quantita: 150
descrizione: |
  Il paladino è un combattente sacro basato su Forza e Carisma, giuramenti, imposizione delle mani e magia divina. La sottoclasse SRD è il Giuramento di Devozione.
tabella_progressione:
  benefici:
  - livello: 1
    privilegi: [imposizione-delle-mani, lancio-incantesimi, maestria-armi]
    incanalare_divinita: 
    incantesimi_preparati: 2
    slot_incantesimo: {livello1: 2, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 2
    privilegi: [stile-di-combattimento, punizione-del-paladino]
    incanalare_divinita: 
    incantesimi_preparati: 3
    slot_incantesimo: {livello1: 2, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 3
    privilegi: [incanalare-divinita, sottoclasse-del-paladino]
    incanalare_divinita: 2
    incantesimi_preparati: 4
    slot_incantesimo: {livello1: 3, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 4
    privilegi: [aumento-punteggi-caratteristica]
    incanalare_divinita: 2
    incantesimi_preparati: 5
    slot_incantesimo: {livello1: 3, livello2: 0, livello3: 0, livello4: 0, livello5: 0}
  - livello: 5
    privilegi: [attacco-extra, destriero-fedele]
    incanalare_divinita: 2
    incantesimi_preparati: 6
    slot_incantesimo: {livello1: 4, livello2: 2, livello3: 0, livello4: 0, livello5: 0}
  - livello: 6
    privilegi: [aura-di-protezione]
    incanalare_divinita: 2
    incantesimi_preparati: 6
    slot_incantesimo: {livello1: 4, livello2: 2, livello3: 0, livello4: 0, livello5: 0}
  - livello: 7
    privilegi: [privilegio-della-sottoclasse]
    incanalare_divinita: 2
    incantesimi_preparati: 7
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 0, livello4: 0, livello5: 0}
  - livello: 8
    privilegi: [aumento-punteggi-caratteristica]
    incanalare_divinita: 2
    incantesimi_preparati: 7
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 0, livello4: 0, livello5: 0}
  - livello: 9
    privilegi: [abiurazione-dei-nemici]
    incanalare_divinita: 2
    incantesimi_preparati: 9
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 2, livello4: 0, livello5: 0}
  - livello: 10
