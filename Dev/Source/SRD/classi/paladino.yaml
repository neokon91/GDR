  - livello: 19
    privilegi: [dono-epico]
    incanalare_divinita: 3
    incantesimi_preparati: 15
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 3, livello4: 3, livello5: 2}
  - livello: 20
    privilegi: [privilegio-della-sottoclasse]
    incanalare_divinita: 3
    incantesimi_preparati: 15
    slot_incantesimo: {livello1: 4, livello2: 3, livello3: 3, livello4: 3, livello5: 2}
privilegi:
- id: imposizione-delle-mani
  nome: "Imposizione delle Mani"
  descrizione: |
    Il tuo tocco benedetto può guarire le ferite. Disponi di una riserva di potere curativo che si rigenera quando completi un Riposo Lungo. Grazie a questa riserva, puoi ripristinare un numero complessivo di Punti Ferita pari a cinque volte il tuo livello da Paladino.

    Come Azione Bonus, puoi toccare una creatura (che potresti essere tu stesso) e attingere potere dalla riserva curativa per ripristinare i Punti Ferita di tale creatura, fino alla quantità massima rimasta nella riserva.

    Puoi anche consumare 5 Punti Ferita dalla riserva di potere curativo per rimuovere la condizione Avvelenato dalla creatura; tali punti non ripristinano Punti Ferita alla creatura.
- id: lancio-incantesimi
  nome: "Lancio di Incantesimi"
  attivita:
    - tipo: incantatore
      caratteristica: carisma
      # Mezzo incantatore: in multiclasse i suoi livelli contano per metà nel
      # livello da incantatore combinato.
      avanzamento: mezzo
  descrizione: |
    Hai imparato a lanciare incantesimi tramite la preghiera e la meditazione.

    **Slot Incantesimo.** La tabella "Caratteristiche del Paladino" indica quanti slot incantesimo possiedi per lanciare i tuoi incantesimi di 1° livello o superiore. Recuperi tutti gli slot consumati al termine di un Riposo Lungo.

    **Incantesimi Preparati di 1° Livello o Superiore.** Prepari l'elenco degli incantesimi di 1° livello o superiore che puoi lanciare grazie a questa caratteristica. Per iniziare, scegli due incantesimi da paladino di 1° livello.

    Il numero di incantesimi nel tuo elenco aumenta man mano che acquisisci livelli da paladino, come indicato nella colonna "Incantesimi Preparati" della tabella "Caratteristiche del Paladino". Ogni volta che tale numero aumenta, scegli ulteriori incantesimi da paladino finché il numero di incantesimi nel tuo elenco non corrisponde a quello indicato nella tabella. Gli incantesimi scelti devono essere di un livello per il quale disponi di slot incantesimo. Per esempio, se sei un paladino di 5° livello, il tuo elenco di incantesimi preparati può includere sei incantesimi da paladino di 1° o 2° livello, in qualsiasi combinazione.

    Se un'altra caratteristica da paladino ti fornisce incantesimi che hai sempre preparati, tali incantesimi non vengono conteggiati nel limite di quelli che puoi preparare con questa caratteristica, ma per te contano comunque come incantesimi da paladino.

    **Cambiare gli Incantesimi Preparati.** Al termine di ogni Riposo Lungo, puoi sostituire un incantesimo del tuo elenco con un altro incantesimo da paladino per il quale disponi di slot incantesimo.

    **Caratteristica da Incantatore.** Il Carisma è la tua caratteristica da incantatore per gli incantesimi da paladino.

    **Focus di Incantesimo.** Puoi utilizzare un simbolo sacro come focus di incantesimo per i tuoi incantesimi da paladino.
- id: maestria-armi
  nome: "Maestria nelle Armi"
  descrizione: |
    Il tuo addestramento con le armi ti consente di utilizzare le proprietà di maestria di due tipi di armi a tua scelta con cui possiedi competenza, come spade lunghe e giavellotti.

    Ogni volta che termini un riposo lungo, puoi cambiare i tipi di armi scelti. Per esempio, potresti passare a utilizzare le proprietà di maestria di alabarde e flagelli.
  attivita:
    - {tipo: scelta, scelta: maestria-arma, quantita: 2, recupero: riposo-lungo}
- id: stile-di-combattimento
  nome: "Stile di Combattimento"
  descrizione: |
    Ottieni un talento di Stile di Combattimento a tua scelta. Invece di scegliere uno di quei talenti, puoi scegliere l'opzione qui sotto.

    **Guerriero Benedetto**
    Impari due trucchetti da chierico a tua scelta. I trucchetti scelti contano come incantesimi da paladino per te e il Carisma è la tua caratteristica da incantatore per essi. Ogni volta che ottieni un livello da paladino, puoi sostituire uno di questi trucchetti con un altro trucchetto da chierico.
- id: punizione-del-paladino
  nome: "Punizione del Paladino"
  descrizione: |
    Hai sempre preparato l'incantesimo Punizione Divina. Inoltre, puoi lanciarlo senza consumare uno slot incantesimo, ma devi terminare un riposo lungo prima di poterlo lanciare nuovamente in questo modo.
- id: incanalare-divinita
  nome: "Incanalare Divinità"
  descrizione: |
    Puoi incanalare energia divina direttamente dai Piani Esterni, usandola per alimentare effetti magici. Inizi con un effetto di questo tipo: Senso Divino, descritto di seguito. Altre capacità del paladino forniscono ulteriori opzioni di effetto per Incanalare Divinità. Ogni volta che usi la capacità Incanalare Divinità di questa classe, scegli quale effetto di questa classe attivare.

    Puoi usare la capacità Incanalare Divinità di questa classe due volte. Recuperi un uso speso al termine di un Riposo Breve e tutti gli usi spesi al termine di un Riposo Lungo. Ottieni un uso aggiuntivo quando raggiungi il livello 11 da paladino.

    Se un effetto di Incanalare Divinità richiede un tiro salvezza, la CD è pari alla CD del tiro salvezza degli incantesimi della capacità Incantesimi di questa classe.

    **Senso Divino.** Come Azione Bonus, puoi aprire la tua percezione per individuare Celestiali, Immondi e Non Morti. Per i successivi 10 minuti, o finché non subisci la condizione Incapace di Agire, conosci la posizione di qualsiasi creatura di quei tipi entro 18 metri (60 piedi) da te e ne conosci il tipo di creatura. Entro lo stesso raggio, percepisci anche la presenza di qualsiasi luogo o oggetto che sia stato consacrato o profanato, come tramite l'incantesimo *Consacrare* (*Hallow*).
  attivita:
    # Senso Divino (individuazione) resta in prosa; qui la sola risorsa.
    - tipo: attivabile
      azione: azione-bonus
      usi: {da_tabella: incanalare_divinita, ricarica: {riposo-breve: 1, riposo-lungo: tutti}}
      durata: {valore: 10, unita: minuti}
      termina_se: [incapacitato]
- id: sottoclasse-del-paladino
  nome: "Sottoclasse del Paladino"
  descrizione: |
    Ottieni una sottoclasse del paladino a tua scelta. Una sottoclasse è una specializzazione che ti conferisce capacità a determinati livelli da paladino. Per il resto della tua carriera, ottieni tutte le capacità della tua sottoclasse corrispondenti al tuo livello da paladino o a livelli inferiori.
- id: aumento-punteggi-caratteristica
  nome: "Aumento dei Punteggi di Caratteristica"
  descrizione: |
    Ottieni il talento Incremento del Punteggio di Caratteristica o un altro talento a tua scelta per il quale soddisfi i prerequisiti. Ottieni nuovamente questa capacità ai livelli 8, 12 e 16 da paladino.
- id: attacco-extra
  nome: "Attacco Extra"
  descrizione: |
    Puoi attaccare due volte invece di una ogni volta che effettui l'azione Attaccare durante il tuo turno.
  attivita:
    - {tipo: passivo, effetti: [{bersaglio: attacchi-per-azione, operazione: aumento, valore: 2}]}
- id: destriero-fedele
  nome: "Destriero Fedele"
  descrizione: 
    Puoi invocare l'aiuto di un destriero ultraterreno. Hai sempre preparato l'incantesimo *Trovare Destriero*.

    Puoi inoltre lanciare l'incantesimo una volta senza consumare uno slot incantesimo; recuperi questa capacità al termine di un Riposo Lungo.
- id: aura-di-protezione
  nome: "Aura di Protezione"
  descrizione: |
    Emani un'aura protettiva invisibile sotto forma di emanazione con raggio di 3 metri (10 piedi) centrata su di te. L'aura è inattiva se ti trovi nella condizione di Incapace.

    Tu e i tuoi alleati all'interno dell'aura ottenete un bonus ai tiri salvezza pari al tuo modificatore di Carisma (bonus minimo di +1).

    Se è presente un altro Paladino, una creatura può beneficiare di una sola Aura di Protezione alla volta; la creatura sceglie quale aura utilizzare mentre si trova al loro interno.
  attivita:
    - tipo: attivabile
      ambito: zona
      concede: aura-di-protezione
      grado: {da_caratteristica: carisma, minimo: 1}
- id: abiurazione-dei-nemici
  nome: "Abiurazione dei Nemici"
  descrizione: |
    Come azione Magica, puoi consumare un utilizzo della capacità Incanalare Divinità di questa classe per sopraffare i nemici con un senso di timore reverenziale. Mentre mostri il tuo Simbolo Sacro o la tua arma, puoi scegliere come bersaglio un numero di creature pari al tuo modificatore di Carisma (minimo una creatura) che puoi vedere entro 18 metri (60 piedi) da te. Ogni bersaglio deve superare un tiro salvezza su Saggezza o subire la condizione Spaventato per 1 minuto o finché non subisce danni. Mentre è Spaventato in questo modo, un bersaglio può compiere solo una delle seguenti azioni durante il proprio turno: muoversi, effettuare un'azione o effettuare un'azione bonus.
  attivita:
    # Costo (Incanalare Divinità), fine "finché non subisce danni" e la restrizione
    # di azioni mentre Spaventato restano in prosa.
    - tipo: tiro-salvezza
      azione: azione
      tiro_salvezza: {caratteristica: saggezza, cd: incantesimo}
      bersagli: {numero: {da_caratteristica: carisma, minimo: 1}, entro: {valore: 18, unita: metri}}
      fallimento:
        - {concede: spaventato, durata: {valore: 1, unita: minuti}}
- id: aura-di-coraggio
  nome: "Aura di Coraggio"
  descrizione: |
    Tu e i tuoi alleati siete immuni alla condizione Spaventato mentre vi trovate all'interno della tua Aura di Protezione. Se un alleato Spaventato entra nell'aura, tale condizione non ha alcun effetto su di lui finché vi rimane.
  attivita:
    - tipo: attivabile
      ambito: zona
      concede: aura-di-coraggio
- id: colpi-radiosi
  nome: "Colpi Radiosi"
  descrizione: |
    I tuoi colpi ora possiedono un potere soprannaturale. Quando colpisci un bersaglio con un tiro per colpire usando un'arma da mischia o un attacco senz'armi, il bersaglio subisce 1d8 danni Radiosi extra.
  attivita:
    - {tipo: passivo, effetti: [{bersaglio: danni.mischia, operazione: somma, valore: {numero_dadi: 1, dado: d8, tipo_danno: radioso}}]}
- id: tocco-rigenerante
  nome: "Tocco Rigenerante"
  descrizione: |
    Quando utilizzi Imposizione delle Mani su una creatura, puoi anche rimuovere una o più delle seguenti condizioni dalla creatura: Accecato, Affascinato, Sordo, Spaventato, Paralizzato o Stordito. Devi consumare 5 Punti Ferita dalla riserva di guarigione di Imposizione delle Mani per ciascuna di queste condizioni che rimuovi; tali punti non ripristinano anche Punti Ferita alla creatura.
- id: espansione-dell-aura
  nome: "Espansione dell'Aura"
  descrizione: |
    La tua Aura di Protezione è ora un'emanazione con un raggio di 9 metri (30 piedi).
- id: dono-epico
  nome: "Dono Epico"
  descrizione: |
    Ottieni un talento Dono Epico o un altro talento a tua scelta per il quale soddisfi i prerequisiti.
