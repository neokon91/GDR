name: ci

# Suite pytest del vault/plugin. GDR è PUBBLICO e si costruisce senza l'archivio privato:
# i dati vengono dalla copia vendorizzata dell'SRD (Dev/Source/SRD, CC-BY-4.0). Il plugin
# bundla il kernel `regole`, clonato accanto in ROOT/regole (dove lo cerca l'import
# `../regole`): col repo pubblico basta il token del workflow, finché è privato serve
# `secrets.ECOSYSTEM_TOKEN` (PAT in lettura). Node serve ai test che invocano crea_pg.js;
# esbuild (devDep del plugin) alla parità _pg_shared.
#
# Il job `deriva-srd` confronta la copia con archivio/srd (privato: serve ECOSYSTEM_TOKEN;
# senza, il job lo dice e non prova niente).

on:
  push:
  pull_request:
  # Una migrazione di archivio e di regole non fa push qui: il giro notturno e quello a richiesta
  # sono ciò che fa emergere una rottura nei dati che questo repo consuma.
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # GDR alla radice del workspace (= common.ROOT); regole accanto, dove lo cerca il plugin.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neokon91/regole
          path: regole
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - name: Dipendenze del plugin (esbuild per la parità _pg_shared)
        run: npm ci
        working-directory: plugin
      - run: python3 -m pytest -q

  deriva-srd:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.ECOSYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - if: env.TOKEN == ''
        run: 'echo "::warning::ECOSYSTEM_TOKEN assente, deriva della copia SRD non controllata"'
      - if: env.TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: neokon91/archivio
          path: archivio
          token: ${{ secrets.ECOSYSTEM_TOKEN }}
      - if: env.TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.TOKEN != ''
        run: pip install -r requirements-dev.txt && python3 Dev/Tools/sync_srd.py --check
